# ─────────────────────────────────────────────────────────────
# 4.8 软技能统一表述规则
# ─────────────────────────────────────────────────────────────
soft_skill_narrative:
  owner: 本人
  ai_may_invent: false
  default_on: true
  scope:
    - 招呼语
    - 简历 / 简历润色
    - 自我介绍
    - 面试陈述
    - 项目复盘
  triggers:
    - 沟通能力
    - 需求拆解能力
    - 用户洞察（读懂用户心思）
    - 跨角色交互协作
  versions:
    compact: "{{软技能短版：专业背景+洞察需求+转化方案+数据}}"
    standard: "{{软技能标准版}}"
    expanded: "{{软技能扩展版}}"
  canonical: standard
  chain:
    - 专业背景
    - 洞察需求
    - 转化为产品方案
    - 数据验证
  chain_must_be_complete: true
  frozen_numbers:
    客户量级: "{{客户量级，如 200+}}"
    好评率: "{{好评率，如 约 90%}}"
    复购率: "{{复购率，如 约 50%}}"
  numbers_rule: "数据保持一致，不得改写或杜撰新的量化指标"
  replaced_experiences:
    - id: coordination
      name: "{{某段不再用于软技能的经历1}}"
      why: "它不是软技能方法论"
      scope: 全禁
    - id: sales
      name: "{{某段不再用于软技能的经历2}}"
      why: "它不是软技能方法论"
      scope: 全禁
  style:
    - "专业克制"
    - "避免空泛自夸"
    - "用事实和因果代替评价"
  checks:
    trigger_words: [沟通, 需求拆解, 拆解需求, 洞察, 同理心, 读懂用户, 用户心智, 跨角色, 协作, 换位思考]
    chain_markers:
      专业背景: ["{{专业背景词}}"]
      洞察需求: [挖掘, 洞察, 深层需求]
      转化为产品方案: [转化, 落地, 产品方案]
      数据验证: ["{{数据1}}", "{{数据2}}", "{{数据3}}"]
    forbid_always: ["{{禁用经历1}}", "{{禁用经历2}}"]
    forbid_when_triggered: ["{{禁用经历1}}", "{{禁用经历2}}"]

# ─────────────────────────────────────────────────────────────
# 4.9 技术栈与作品集
# ─────────────────────────────────────────────────────────────
tech_stack:
  source: 本人SOP
  items: ["{{技术栈项1}}", "{{技术栈项2}}", "{{技术栈项3}}"]
  portfolio: "{{作品集URL}}"
  note: |
    技术栈不直接罗列进招呼语，用途是判定能否做"能力迁移论证"。

# ─────────────────────────────────────────────────────────────
# 5. 简历锚点库（只用真实数据，不得扩写）
# ─────────────────────────────────────────────────────────────
anchor_pick:
  tech_anchors:
    - project_rag
    - project_intern
    - project_workflow
  tech_boost: 2
  force_first_when:
    anchor: project_rag
    jd_triggers:
      - RAG
      - 知识库
      - 知识检索
      - 向量检索
      - 向量库
      - 语义检索
      - 检索增强
      - 召回
      - Embedding
      - 大模型应用
      - LLM 应用
      - 多轮对话
      - 提示词
      - Prompt
      - 评测集
      - 幻觉
      - 内容生成
      - AI Agent
      - Agent
      - 大模型
      - 评测
      - 评估
      - 质量评估
      - 效果评估
      - 测试集
      - 评测标准
      - 指标
      - 数据标注
      - 降级
      - 兜底
      - 稳定性
      - 异常处理
      - 容错
      - 健壮性
      - 可靠性
      - 高可用
      - fallback
      - 流程
      - 质量
      - 闭环
      - 复核
  mutually_exclusive:
    - [psychology, ToC_service]

# ─────────────────────────────────────────────────────────────
# 模型按「只选不写」接入（可选，默认关）
# ─────────────────────────────────────────────────────────────
evidence_pick:
  enabled: false
  max_candidates: 6
  max_calls_per_greeting: 10
  temperature: 0.0
  timeout_seconds: 20
  lock_when_forced: true
  lock_first: true
  fallback: rule
  hard_rules: |
    1. 模型输出的必须严格是候选编号之一，否则整次作废，退回规则版；
    2. 铁律触发时第一条能力点锁死；
    3. 请求走 model_client.chat → 自动过隐私脱敏；
    4. 超过 max_calls_per_greeting 次就停手。

# 证据来源（_check_anchors.py 拿这些文件当依据）
evidence_sources:
  note: |
    锚点里的数字/词组必须能在下列文件里找到，找不到就是编造。
  files:
    - "{{简历原文路径1}}"
    - "{{项目原件路径2}}"

# 简历锚点库（每个数字/词组都必须能在证据来源里找到）
resume_anchors:
  ToC_service:
    text: "{{ToC服务经历：客户量/好评率/复购率}}"
    short: "{{ToC服务短版}}"
    proves: [用户沟通, 服务交付, 复购引导]
  sales:
    enabled: false
    text: "{{销售经历}}"
    short: "{{销售经历短版}}"
    proves: [转化, 抗压]
  coordination:
    enabled: false
    text: "{{协调经历}}"
    short: "{{协调经历短版}}"
    proves: [多线程协调, 结果导向]
  bizsim:
    text: "{{商业比赛经历}}"
    short: "{{商业比赛短版}}"
    proves: [商业决策, 团队协作]
  content:
    text: "{{内容传播经历}}"
    short: "{{内容传播短版}}"
    proves: [内容传播, 项目收尾]
  project_rag:
    text: "{{核心技术项目：项目名+技术细节+数据}}"
    short: "{{核心技术项目短版}}"
    proves: [需求拆解, RAG, 评测意识, 工程健壮性, 数据分析]
    blocks:
      - duty: "{{块1职责}}"
        data: "{{块1数据}}"
        skill: "{{块1技能}}"
      - duty: "{{块2职责}}"
        data: "{{块2数据}}"
        skill: "{{块2技能}}"
    github: "{{项目作品集URL}}"
    need_github_phrase: true
  project_intern:
    block_lead: "也在『某岗位实习』中做过"
    text: "{{实习项目：项目名+技术细节+数据}}"
    short: "{{实习项目短版}}"
    proves: [AI 产品化, 评估体系, 交付闭环]
    blocks:
      - duty: "{{块1职责}}"
        data: "{{块1数据}}"
        skill: "{{块1技能}}"
      - duty: "{{块2职责}}"
        data: "{{块2数据}}"
        skill: "{{块2技能}}"
  project_workflow:
    text: "{{工作流项目：流程+状态+验收规则}}"
    short: "{{工作流项目短版}}"
    proves: [流程设计, 状态机, 质量意识]
    blocks:
      - duty: "{{块1职责}}"
        data: "{{块1数据}}"
        skill: "{{块1技能}}"
      - duty: "{{块2职责}}"
        data: "{{块2数据}}"
        skill: "{{块2技能}}"
  psychology:
    text: "{{软技能统一表述完整版}}"
    short: "{{软技能统一表述短版}}"
    say_as: ability
    proves: [需求拆解, 沟通, 洞察, 同理心, 协作, 用户, 产品方案]
    enabled: true
    max_per_message: 1
    placement: hook
    soft_skill_default: true
    chain: [专业背景, 洞察需求, 转化为产品方案, 数据验证]
    frozen_numbers: ["{{数据1}}", "{{数据2}}", "{{数据3}}"]

# ─────────────────────────────────────────────────────────────
# 6. 三版输出
# ─────────────────────────────────────────────────────────────
variants_output:
  full:   "饱满版：JD 锚点 + 2 条简历锚点 + 提问结尾"
  human:  "活人版：口语化，允许短句和不完整体"
  brief:  "精简版：压缩行数，保留最强 1 条锚点"
  shared_rule: "三版都必须含 career_hook（用'最主要的是'引出职业规划）"

required_discourse:
  career_hook_phrase: "最主要的是"
  connectives_preferred: ["并且", "另外", "同时", "而且"]
  invent_data: forbidden

# ─────────────────────────────────────────────────────────────
# 7. 二次跟进
# ─────────────────────────────────────────────────────────────
followup:
  enabled: true
  min_days: 3
  max_per_target: 1
  evidence: true
  length_ratio: 0.5
  length_floor: 45
  hard_rules:
    - "不得复述第一条的任何句子"
    - "必须带一个全新的 JD 锚点，或换一条没用过的简历经历"
    - "长度 ≤ 第一条的一半"
    - "同一对象最多跟一次"
    - "找不到新东西可说就不发"
  exemptions:
    - "career_hook_phrase（职业规划句）"
    - "LENGTH 下限"
  openers:
    - "您好，再补一句："
    - "打扰一下，补个更直接的点："
    - "您好，另外想到一点："
  closings:
    - { id: "F1", text: "方便的话我把简历发您。" }
    - { id: "F2", text: "若方便，想补发一份简历。" }
    - { id: "F3", text: "希望能有机会细聊。" }

# ─────────────────────────────────────────────────────────────
# 7.5 面试之后
# ─────────────────────────────────────────────────────────────
interview_followup:
  enabled: true
  evidence: true
  thanks:
    when: "面试当天，最迟 24 小时内"
    length: "3–4 句 ≈ 60–110 字"
    must_have:
      - "点对方的姓/称谓 + 具体日期 + 具体岗位"
      - "一个只有你俩在场才知道的细节"
      - "重提面试里谈到的那个核心挑战，并接一句你当时给的数字"
    must_not:
      - "为面试表现道歉"
      - "大段补述你没来得及说的话"
      - "薪水、福利、任何让人多干活的请求"
  status_ask:
    when: "以面试官给的时间线为准；没给就按 5–7 个工作日"
    max_times: 2
    channel: "文字优先"

# ─────────────────────────────────────────────────────────────
# 7.6 被拒之后
# ─────────────────────────────────────────────────────────────
rejection:
  evidence: false
  four_moves:
    - "先等 24 小时再回"
    - "感谢，具体地说到某个人某件事"
    - "问【一个】容易回答的反馈问题"
    - "表达未来意愿并留一个接口"
  must_not:
    - "争辩、要求对方重新考虑"
    - "追问为什么"
    - "在同一封里既要反馈又要推荐别家"
  reapply_gap: "类似岗位至少隔半年再审"

# ─────────────────────────────────────────────────────────────
# 8. 回复率台账
# ─────────────────────────────────────────────────────────────
ledger:
  file: "data/greeting_ledger.csv"
  required_before_launch: true
  min_sample_before_conclusion: 60
  fields:
    - send_time
    - hr_gender_source
    - salutation_variant
    - closing_variant
    - word_count
    - has_jd_anchor
    - read_24h
    - read_72h
    - replied
  analysis_plan: "跑满 60 条后，按 salutation_variant / closing_variant / word_count 分组算回复率"

# ─────────────────────────────────────────────────────────────
# 9. 模型路由（可留空或填自己的模型）
# ─────────────────────────────────────────────────────────────
model_routing:
  coarse_filter: "{{你的粗筛模型}}"
  semantic_scoring: "{{你的打分模型}}"
  greeting_draft: "{{你的话术模型}}"
  greeting_review: "{{你的审核模型}}"

# ─────────────────────────────────────────────────────────────
# 10. 待本人拍板
# ─────────────────────────────────────────────────────────────
settled_2026_10_29:
  note: "使用者对机器提出的待定问题逐条给结论"
  items: []

still_pending:
  - id: 示例待定项
    current: "{{你的默认处理}}"
    reason: "{{为什么待定}}"
    options: []
