# 打招呼语生成规范 · 开源模板（零个人信息）
# 用途：生成与质检打招呼语的唯一事实源；改这里不用改代码
#
# ⚠ 这是【空模板】。所有 {{占位符}} 都由使用者自己填。
#    本文件不含任何真实个人 / 项目 / 数据信息，可放心用于开源。
#    结构完整（代码读到的字段这里都有），照着填即可，也可整段改写。
#
# 使用方式：
#   1. 复制本文件为 greeting_spec.yaml（去掉 .example）
#   2. 把所有 {{占位符}} 换成你自己的真实信息
#   3. 六段框架顺序建议保留（称呼→学历→能力→动机→到岗→结尾），可自行调整

meta:
  version: v3.0-final
  updated: "{{你的更新日期}}"
  source_of_truth: "{{你的SOP或话术来源}}"
  owner: 本人          # ★ 只有本人可以改。机器不得自行增删任何一条
  ai_may_invent: false # 机器只做"按规则执行"，不发明、不发挥、不优化
  note: |
    ⚠ 本文件由使用者本人覆盖重写。规则以本人 SOP 为准。

# ─────────────────────────────────────────────────────────────
# 1. 量化公式
# ─────────────────────────────────────────────────────────────
quantified_formula:
  v1: "量化数据 + 核心动作 + 产出结果"
  v2: "做过的项目(一句话) + 量化数据 + 核心动作 + 产出结果"   # ← 补 STAR 的 S/T
  rationale:
    evidence: true
    note: |
      缺 S/T，数字失去标尺：HR 不知道增长从多少涨到多少。
      S/T 用【项目名称】交代，项目名本身就是标尺。
    source:
      - "DDI 官方 1974 STAR 定义"
      - "TheLadders 2018 眼动研究（7.4 秒初筛）"
  constraint: |
    S/T 用【项目名称】交代，一句话说完，不许写成铺垫段落。
  caveat: "用台账验证补 S/T 是否真能提高回复率"

# ─────────────────────────────────────────────────────────────
# 2. 称呼
# ─────────────────────────────────────────────────────────────
salutation:
  default: "您好"
  rules:
    - when: "boss_name 含『女士』→ 明确女性"
      use: "取第一个字 + 姐姐 + 您好"
    - when: "boss_name 含『先生』→ 明确男性"
      use: "取第一个字 + 总 + 您好"
    - when: "boss_name 是全名、性别不明"
      use: "取第一个字 + 总 + 您好"
    - when: "拿不到姓名，或判断不了"
      use: "您好 —— 不猜，猜错比不用更糟"
  salutation_suffix: "您好"
  gender_unknown: "按男性处理，称『某总』"
  settled: "{{你的定稿日期}}"
  variants:
    - { id: neutral, text: "您好", when: default }
    - { id: jiejie,  text: "姐姐", when: all_conditions_met }
  conditions_for_jiejie:
    - "对方从头像/昵称判断明显年轻"
    - "岗位/公司调性偏扁平"
  on_gender_uncertain: "一律用您好 —— 猜错比不用更糟"

# ─────────────────────────────────────────────────────────────
# 3. 结尾
# ─────────────────────────────────────────────────────────────
closing:
  fixed: true
  fixed_id: Z
  fixed_text: "{{你的固定结尾礼貌语}}"
  fixed_variants:
    - { id: G1, text: "{{结尾变体1}}" }
    - { id: G2, text: "{{结尾变体2}}" }
    - { id: G3, text: "{{结尾变体3}}" }
    - { id: G4, text: "{{结尾变体4}}" }
  variants:
    - { id: Z, text: "{{你的固定结尾句}}", type: 愿望型 }
    - { id: A, text: "{{提问型结尾1}}", type: 提问型 }
    - { id: B, text: "{{提问型结尾2}}", type: 提问型 }
    - { id: C, text: "{{提问型结尾3}}", type: 提问型 }
    - { id: D, text: "{{提问型结尾4}}", type: 提问型 }
  pick_by_situation:
    - { id: D, when_any: [Agent, 智能体, 大模型, LLM, 工作流, 技术路线], why: "对方在做技术方向选择" }
    - { id: C, when_any: [培养, 带教, 成长, 新人, 应届, 实习, 0到1, 从零], why: "岗位偏初阶或写明带教" }
    - { id: B, when_any: [协作, 对接, 跨部门, 沟通, 协调, 推进各方], why: "JD 强调多方协作" }
    - { id: A, when_any: [难点, 挑战, 搭建, 体系, 优化, 落地], why: "岗位在推进中的业务" }
    - { id: Z, when_any: [], why: "兜底" }

# ─────────────────────────────────────────────────────────────
# 3.5 自我介绍（固定句）
# ─────────────────────────────────────────────────────────────
self_intro:
  enabled: true
  text: "{{我是某学校某届某专业本科在读}}"
  placement: "紧跟在称呼之后，固定不变"
  variants:
    - { id: A1, text: "{{自我介绍变体1}}" }
    - { id: A3, text: "{{自我介绍变体2}}" }
    - { id: A4, text: "{{自我介绍变体3}}" }

# ─────────────────────────────────────────────────────────────
# 开头流水账结构（intro_flow）
# ─────────────────────────────────────────────────────────────
intro_flow:
  enabled: true
  intern_line: "{{曾于某公司某岗位实习}}"
  intern_line_variants:
    - { id: B1, text: "{{实习句变体1}}" }
    - { id: B2, text: "{{实习句变体2}}" }
    - { id: B3, text: "{{实习句变体3}}" }
    - { id: B4, text: "{{实习句变体4}}" }
  connectors: ["也", "同时"]
  rag_opener: "{{我做过某项目，且已实际应用}}"
  rag_opener_anchors: [project_rag]
  rag_opener_variants:
    - { id: C1, text: "{{项目总起句变体1}}" }
    - { id: C2, text: "{{项目总起句变体2}}" }
    - { id: C3, text: "{{项目总起句变体3}}" }
    - { id: C4, text: "{{项目总起句变体4}}" }

# ─────────────────────────────────────────────────────────────
# 到岗信息
# ─────────────────────────────────────────────────────────────
availability:
  enabled: true
  text: "{{每周可出勤X天、实习X个月以上}}"
  placement: "框架第 5 段（求职动机之后、结尾之前）"
  variants:
    - { id: F1, text: "{{到岗句变体1}}" }
    - { id: F2, text: "{{到岗句变体2}}" }
    - { id: F3, text: "{{到岗句变体3}}" }
    - { id: F4, text: "{{到岗句变体4}}" }
  intern_only: true          # ★ 只有实习岗才写到岗句；非实习岗整句不出现
  intern_extra: 可随时到岗   # ★ 实习岗在这句话后面追加
  detect_intern:
    signals:
      - id: 结构化字段
        rule: "days_per_week 或 least_month 有值 → 实习"
      - id: 薪资单位
        rule: "salary_raw 含『元/天』或『/天』 → 实习"
      - id: 岗位名关键词
        in_fields: [title]
        keywords: [实习, 实习生, 见习, 实习期, intern, Intern, INTERN]
    fallback: "非实习"

# ─────────────────────────────────────────────────────────────
# 3.6 能力展现
# ─────────────────────────────────────────────────────────────
evidence_format:
  source: 本人SOP
  rule: "提取 JD 中的核心需求点，与我的经历和能力点逐一匹配"
  pattern: "经历 ＋ 量化数据 ＋ 对应能力"
  must_end_with_ability: true
  ability_clause:
    default: "能独立完成{name}"
    exceptions:
      "{{能力名}}": "{{对应能力的具体说法}}"
      # 例：RAG 检索: "能把检索这块调到可信"
      #     需求拆解: "能把模糊的需求拆成能做的条目"

# ─────────────────────────────────────────────────────────────
# 3.7 重点项目必须带 GitHub + 作品集（可选）
# ─────────────────────────────────────────────────────────────
rag_github_rule:
  source: 本人SOP
  enabled: true
  rule: "只要提到我的某个重点项目，必须描述【已上传到 GitHub】且【有作品集】"
  triggered_by: [project_rag]
  text: "已上传到 GitHub，并配了可访问的作品集"
  text_variants:
    - { id: D1, text: "{{GitHub句变体1}}" }
    - { id: D2, text: "{{GitHub句变体2}}" }
    - { id: D3, text: "{{GitHub句变体3}}" }
    - { id: D4, text: "{{GitHub句变体4}}" }
  portfolio_url: "{{你的作品集URL}}"

# ─────────────────────────────────────────────────────────────
# 3.8 匹配不足怎么办
# ─────────────────────────────────────────────────────────────
mismatch_policy:
  source: 本人SOP
  steps:
    - order: 1
      action: 能力迁移论证
      rule: "JD 要求的某能力点我没有对应经历时，先对【已有的能力】做合理的能力迁移论证"
    - order: 2
      action: 能力编造
      rule: "若迁移也确实无法成立，可对该需求点【最主要的能力】进行编造"
  hard_ban:
    - "严禁编造任何经历"
    - "严禁编造任何数据"
  record_in_ledger: true
  ledger_field: "invented_ability"

# ─────────────────────────────────────────────────────────────
# 3.9 求职动机
# ─────────────────────────────────────────────────────────────
motivation:
  source: 本人SOP
  prefix: "最主要的是我"
  rule: "自动生成针对【该公司】和【该岗位】的合理化投递理由，理性价值判断，不得讨好奉承"
  must_mention: [行业前景 或 个人长期规划]
  flattery_ban:
    enabled: true
    rule: "体现理性价值判断，不是讨好、奉承对方"
    forbid:
      - "真的想去这家公司"
      - "很想去这家公司"
      - "很想加入贵司"
      - "对贵司仰慕已久"
      - "贵司平台广阔"
      - "贵司前景好"
      - "是我理想的公司"
      - "非常向往"
      - "特别想来"
      - "希望能给个机会"
  angle:
    default: career
    career:
      name: 个人长期规划
      tpl: "最主要的是我长期规划打算深耕{goal}这个岗位"
      example: "{{最主要的是我长期规划打算深耕XX岗位}}"
    industry:
      name: 行业前景
      tpl: "最主要的是我认为{industry}行业十分具有前景"
      example: "{{最主要的是我认为XX行业发展十分具有前景}}"
    career_variants:
      - { id: E1, text: "{{职业规划句变体1}}" }
      - { id: E2, text: "{{职业规划句变体2}}" }
      - { id: E3, text: "{{职业规划句变体3}}" }
      - { id: E4, text: "{{职业规划句变体4}}" }
  industry_fallback: "AI 应用"
  industry_words:
    - match: [AIGC, 生成式, 文生图, 生图, 绘画, 图像生成, 视频生成]
      word: AIGC
    - match: [大模型, LLM, Agent, 智能体, RAG, 提示词]
      word: 大模型应用
    - match: [AI, 人工智能, 机器学习]
      word: AI 应用
  templates:
    with_company: "最主要的是我长期规划打算深耕{goal}这个岗位"
    no_company:   "最主要的是我长期规划打算深耕{goal}这个岗位"

# ─────────────────────────────────────────────────────────────
# 3.5 长度上限
# ─────────────────────────────────────────────────────────────
length:
  min: 120
  max: 400
  settled_by: 本人
  settled_on: "{{你的定稿日期}}"

# ─────────────────────────────────────────────────────────────
# 4. 质量门（全过才能进待审队列）
# ─────────────────────────────────────────────────────────────
quality_gate:
  - id: anchors
    rule: "必须同时含 1 个 JD 锚点 + 1 个简历锚点"
    jd_anchor: "JD 原文里的原词、具体职责、或该公司/产品的具体信息"
    on_fail: rewrite

  - id: similarity
    rule: "已删除 —— 不再刻意压低与已发招呼语的相似度"
    enabled: false
    on_fail: pass

  - id: length
    rule: "落在 length.min ~ length.max 之间"
    on_fail: rewrite

  - id: forbidden
    rule: "禁用词命中即重写"
    words:
      weak_verbs:      ["琢磨", "聊得来", "不发怵", "应该还行", "大概"]
      self_lowering:   ["其实", "可能不太", "虽然我没什么", "如果不嫌弃"]
      expose_weakness: ["愿意补", "还在学", "虽然我经验不足", "会努力跟上"]

  - id: evidence_check
    rule: "事实性信息（数字 / 项目名 / 公司名 / 时间 / 量化成果）必须真实存在于简历原文"
    method: "回溯：把生成的话拆回 JD 句 ID 与简历条目 ID，查无对应即判编造"
    on_fail: rewrite

# ─────────────────────────────────────────────────────────────
# 4.5 能力型补充库
# ─────────────────────────────────────────────────────────────
capability_pool:
  enabled: true
  max_per_message: 1
  hard_rule: |
    只准以"掌握/熟悉/能/会用 + 某项技术或能力"的形式出现。
    句子里一旦出现数字、项目名、公司名、时间、业绩成果，整条作废。
  items:
    - id: "{{能力ID1}}"
      text: "{{能力描述1}}"
      short: "{{能力短句1}}"
      match: ["{{命中词1}}"]
      resume_backing: true
    - id: "{{能力ID2}}"
      text: "{{能力描述2}}"
      short: "{{能力短句2}}"
      match: ["{{命中词2}}"]
      resume_backing: true
    # 例：
    # - id: rag
    #   text: "熟悉 RAG 的检索流程：关键词检索和向量检索怎么配合、什么时候该降级兜底"
    #   short: "熟悉 RAG 检索与降级兜底"
    #   match: [RAG, 检索, 知识库, 向量, 召回, Embedding, BM25]
    #   resume_backing: true

# ─────────────────────────────────────────────────────────────
# 4.2 JD 需求点怎么处理
# ─────────────────────────────────────────────────────────────
jd_points:
  rule: "先判断 JD 最重视的三条能力，再按重视度从高到低，用我们的经历/能力去接"
  max_points: 3
  min_points: 2
  must_be_matchable: true
  pick_order: "按【词的权重 × 出现次数 + 出现位置】算重视度，取前 3 条"

# ─────────────────────────────────────────────────────────────
# 4.2 拆 JD
# ─────────────────────────────────────────────────────────────
jd_decompose:
  explicit_keywords:
    tech:
      - RAG
      - Agent
      - 智能体
      - 大模型
      - LLM
      - 向量检索
      - 语义检索
      - 检索增强
      - 知识库
      - Embedding
      - 多模态
      - 混合检索
      - 提示词
      - Prompt
      - AIGC
      - 评测
    product:
      - PRD
      - 需求文档
      - 需求分析
      - 需求拆解
      - 场景拆解
      - 原型
      - Figma
      - 竞品分析
      - 用户研究
      - 用户洞察
      - 用户访谈
      - 产品规划
      - 功能设计
      - 交互
      - 上线迭代
  hard_constraints:
    - id: 学历门槛
      keywords: ["985", "211", "硕士", "研究生", "博士", "统招"]
      note: "JD 要求「{match}」，学历可能被卡"
    - id: 经验年限
      keywords: ["3年以上", "三年以上", "5年以上", "五年以上", "2年以上", "两年以上", "1年以上", "全职经验"]
      note: "JD 写「{match}」，可能不招应届/实习"
    - id: 出勤
      keywords: ["每周5天", "每周 5 天", "每周4天", "全勤", "坐班", "到岗"]
      note: "JD 出勤要求「{match}」，核对你的可出勤时间"
    - id: 转正
      keywords: ["转正", "留用", "可留任"]
      note: "有转正/留用通道（「{match}」），可主动问"
    - id: 编程要求
      keywords: ["Python", "SQL", "编程", "写代码", "代码能力", "开发经验"]
      note: "JD 含编程要求「{match}」，注意是否超出能力范围"
    - id: 实习时长
      keywords: ["个月", "实习期", "实习时长", "时长"]
      note: "JD 提到「{match}」，核对实习时长要求"

# ─────────────────────────────────────────────────────────────
# 4.3 JD 关键词 → 能力名
