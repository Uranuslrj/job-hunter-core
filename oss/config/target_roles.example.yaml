# Boss 直聘 · 目标岗位定义与打分策略（模板）
# ─────────────────────────────────────────────────────────────
# 这是「空模板」。所有 {{占位符}} 都需要你填成自己的信息，
# 填完把本文件另存为 target_roles.yaml 即可生效。
# 没有占位符的字段是「通用逻辑」，一般不用改。

meta:
  owner: "{{你的昵称或ID}}"
  status: active
  mode: high_volume_daytime        # conservative（保守） / high_volume（高量产）

# ─────────────────────────────────────────────────────────────
# 1. 身份与硬过滤（★ 全部填你自己的信息）
# ─────────────────────────────────────────────────────────────
identity:
  graduation_year: "{{你的毕业年份}}"      # 例：2027
  degree: "{{你的学历}}"                    # 例：本科一本在读
  major: "{{你的专业}}"                     # 例：计算机科学与技术
  school: "{{你的学校全称}}"                # 例：某某大学
  tracks_accepted: [校招, 实习]             # 投校招 / 实习，可多选
  resume_versions: "{{你有几份简历版本}}"

hard_filter:
  verify_fields: [city_from_detail, salary_raw, jobLabels, jd_text, company_name]

  city:
    cities: ["{{你的目标城市，用逗号分隔}}"]   # 例：北京, 上海, 深圳
    match_mode: exact

  work_mode:
    remote_accepted: "{{是否接受远程 true/false}}"
    onsite_accepted: "{{是否接受现场 true/false}}"

  availability:
    start_date: "{{到岗时间}}"                 # 例：随时到岗 / 下月
    interview_availability: "{{面试时间}}"     # 例：随时有空

  salary:
    track_aware: true
    workdays_per_month: 21.75
    internship:
      tier1_daily_yuan: "{{一线城市日薪下限}}"       # 例：150
      tier_other_daily_yuan: "{{其他城市日薪下限}}"   # 例：130
      tier1_cities: [北京, 上海, 深圳, 杭州, 广州]    # 你自己的一线城市定义
    campus:
      floor_monthly_k: null                    # 校招月薪下限（null=不设）
    on_missing: not_filter

  school_only_signals:       # JD 正文命中即淘汰（可增删）
    - "仅限985"
    - "仅限211"
    - "仅限硕士"
    - "要求3年以上"
    - "仅社招"

  intensity_signals:         # 工作强度硬门槛：JD 命中即淘汰（不打分，一票否决）
    - "大小周"                # 大小周/单休/996 类明确高强度
    - "单休"
    - "996"
    - "007"
    - "长期出差"
    - "无加班费"

  company_blacklist: []       # 绝对不投的公司，留空=没有
  industry_blacklist:         # 不投的行业
    - "保险代理"
    - "信用卡分期"
    - "催收"

# ─────────────────────────────────────────────────────────────
# 2. HR 活跃度（通用逻辑，一般不用改）
# ─────────────────────────────────────────────────────────────
hr_activity:
  target: "一周内活跃"
  accepted: [now, today, d3, d7]
  strategy: two_stage
  detail_lookup_daily_cap: 120

# ─────────────────────────────────────────────────────────────
# 3. 目标岗位族（★ 填你想投的岗位名和关键词）
# ─────────────────────────────────────────────────────────────
role_clusters:
  - id: "{{岗位族ID，英文}}"          # 例：ai_product_manager
    label: "{{岗位族名称}}"            # 例：AI 产品经理
    tier: primary                     # primary（主投） / secondary（JD判定）
    native_category: true
    include:                          # 这个岗位的各种叫法
      - "{{岗位别名1}}"
      - "{{岗位别名2}}"
    include_pairs:                    # 双条件匹配：两组词各命中一个才算
      ai_words: ["AI", "大模型", "Agent"]
      role_words: ["产品经理", "产品实习生"]
    cities: []                          # 「岗位族 × 城市」交叉筛选（可选项）
    # ↑ 留空 [] = 该族不限城市，跟随 hard_filter.city 全局清单。
    #   想限制就填，例：cities: ["北京", "上海"] → 该族只投这两个城市的岗。

# 只对【岗位标题】生效的排除词
title_exclude:
  - "总监"
  - "算法"

# 经验年限门槛（通用逻辑）
experience_senior_signals:
  - "5-10年"
  - "3年以上"
  - "2年以上"
  - "资深"
  - "专家"
experience_junior_signals:
  - "实习"
  - "应届"
  - "在校"
  - "经验不限"

exclude_keywords:
  - "课程顾问"
  - "电话销售"
  - "地推"

# ─────────────────────────────────────────────────────────────
# 4. 打分 Rubric（通用逻辑，权重可按自己偏好调）
#
# 权重口径说明（为什么是这 4 个维度、这个权重）：
#   依据「岗位评估维度与权重」调研稿（research/岗位评估维度与权重/）：
#   应届生共识 = 成长空间 > 行业赛道 > 岗位匹配 > 薪酬（薪酬是门槛不是目标）。
#   - 领导团队：拆成两半——"带教/导师"并入成长空间，"领导风格"移到面试阶段人工判断。
#   - 工作强度：降级为扫描硬门槛（见 hard_filter.intensity_signals），不进打分。
#   - 行业赛道/平台：新增维度（旧版缺失），用公司规模标签 + 行业关键词判断。
# ─────────────────────────────────────────────────────────────
scoring:
  model_tier: semantic
  require_evidence: true
  dimensions:
    - { key: growth_stage,     name: "成长空间/带教",   weight: 30 }
    - { key: industry_platform, name: "行业赛道/平台",   weight: 20 }
    - { key: role_match,       name: "岗位匹配度",       weight: 20 }
    - { key: pay_value,        name: "薪酬性价比",       weight: 10 }
  thresholds:
    strong: 60       # ≥60 自动发送
    hard_floor: 55   # 低于此绝对不投

# ─────────────────────────────────────────────────────────────
# 5. 投递侧配额与限速（★ 按自己节奏调，别照抄别人的量）
# ─────────────────────────────────────────────────────────────
delivery:
  mode: auto_cdp                   # confirm_only（自己粘）/ auto_cdp（机器发）
  human_gate: first_30s            # 每天第一条人看30秒
  daily_greet_cap: "{{你每天想投多少条}}"   # 例：30（保守）或 100（激进）
  interval_seconds: [12, 35]
  dedupe_window_days: 90

schedule:
  timezone: Asia/Shanghai
  daily_target: "{{每天目标条数}}"
