# 领域：知识调研（knowledge_research）
# 换领域只改这三样东西：external_anchors / checklist / rulebook

domain:
  name: "知识调研"
  description: "把一个模糊问题做成'有据可查、可核验'的调研结论"

# 三样东西之一：外部抓手（对错靠什么客观依据）
external_anchors:
  - "核对每条结论引用的 URL 是否真实存在"
  - "核对来源是否独立（不是同一篇通稿的转载）"
  - "核对结论是否有 ≥2 个独立来源"

# 三样东西之二：指标清单
checklist_A_correctness:
  - "引用的来源真的存在、且内容与结论一致？"
  - "结论是否只有单一来源（该降级为'线索'而非'结论'）？"
  - "【多样性剪枝】'这个观点是共识'这个默认假设，是否值得挑战？"
  - "有没有关键的反例/矛盾来源被漏掉？"

checklist_B_compliance:
  - "每条结论是否都带可点击的原始 URL？"
  - "矛盾是否并列呈现，而不是偷偷选一边？"
  - "有没有用'通常来说/一般认为'这类无来源措辞掩盖缺口？"
  - "单源内容是否被错误写进了结论区？"
  - "【人审闸门】该由人确认才能入库的内容，是否被机器当成了定论？"

# 三样东西之三：规则手册
rulebook:
  - "双源规则：一个事实要 ≥2 个独立来源才写成结论"
  - "矛盾不抹平：并列呈现双方观点 + 各自 URL"
  - "缺口优先于编造：查不到就写进缺口清单"
  - "URL 必须留存，禁止'据某某资料显示'这种无法溯源表述"
  - "人审闸门：候选稿未确认，一个字都不写进知识库"

# 可选：业务效果定义
business_metric:
  definition: "一份调研稿从开始到'可入库'所需的返工次数/时间"
  unit: "返工次数 / 天"
