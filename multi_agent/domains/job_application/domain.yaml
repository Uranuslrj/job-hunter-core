# 领域：投简历（job_application）
# 换领域只改这三样东西：external_anchors / checklist / rulebook

domain:
  name: "投简历"
  description: "读一条 JD，匹配我的条件，产出'该投不该投 + 怎么投'的方案"

# 三样东西之一：外部抓手（对错靠什么客观依据）
external_anchors:
  - "核对 JD 原文（岗位要求是否被曲解）"
  - "核对引用来源 URL 是否存在"
  - "核对公司/岗位背景信息是否真实"

# 三样东西之二：指标清单
checklist_A_correctness:
  - "引用的 JD 内容/来源真的存在，且不是编造？"
  - "匹配依据是否和 JD 原文对得上（有没有曲解 JD）？"
  - "【多样性剪枝】'这个岗位就该这么投'这个默认假设，是否值得单独挑战？"
  - "有没有更优的投法/更匹配的岗位被漏掉？"

checklist_B_compliance:
  - "招呼语是否严格遵循六段框架（称呼→学历→能力→动机→到岗→结尾）？"
  - "字数是否达标、是否踩了禁用词？"
  - "数据是否真实（没有编造数字）？"
  - "输出字段是否齐全、来源可溯源？"

# 三样东西之三：规则手册
rulebook:
  - "招呼语六段框架顺序不可调换"
  - "能力可发挥，经历与数据绝不编造"
  - "到岗只写'每周5天、6个月以上'"
  - "禁用词清单（见 config/greeting_spec.yaml）"

# 可选：业务效果定义
business_metric:
  definition: "投递后拿到回复/面试的比例"
  unit: "回复率 / 面试率 %"
