# 隐私词表（模板）
# ─────────────────────────────────────────────────────────────
# 把你「绝不能原样发给模型」的值填进对应列表，填完另存为 privacy.yaml。
# 每个值会被替换成 <PERSON> / <PHONE> / <EMAIL> 这类占位符，
# 模型只看到占位符，拿回结果后由代码换回真值。

person:          # 姓名（本人 + 家人 + 熟人）
  # - {{你的姓名}}
  # - {{家人姓名}}

school:          # 学校全称
  # - {{你的学校全称}}

company:         # 工作过的公司全称
  # - {{公司1}}
  # - {{公司2}}

address:         # 住址 / 详细地址（城市这种宽泛词不要放这里）
  # - {{详细住址}}

phone:           # 手机号（正则能兜底，这里留作显式备份）
  # - {{你的手机号}}

email:           # 邮箱
  # - {{你的邮箱}}

url:             # 个人网站 / 作品集（不想让厂商知道的话就填）
  # - {{你的作品集URL}}
