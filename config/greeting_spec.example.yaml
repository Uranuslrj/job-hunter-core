# ─────────────────────────────────────────────────────────────
# 4.8 软技能统一表述规则（本人 2026-10-29 亲自定，全局生效）
# ─────────────────────────────────────────────────────────────
soft_skill_narrative:
  owner: 本人
  ai_may_invent: false
  default_on: true
  # ★ 这条规则【不只管招呼语】。下面列的所有场景，只要碰到软技能就套用。
  scope:
    - 招呼语
    - 简历 / 简历润色
    - 自我介绍
    - 面试陈述
    - 项目复盘
    - 任何需要体现软技能的表述
  note: |
    本人 2026-10-29 原话：「凡需要体现『沟通能力』『需求拆解能力』『用户洞察或读懂用户心思』
    『跨角色交互协作』等软技能，均使用下方素材，不再以{{经历公司B}}、{{经历公司A}}的经历作为例证。」

  # ① 触发场景：命中任一项 → 用这套素材，不用{{经历公司B}} / {{经历公司A}}
  triggers:
    - 沟通能力
    - 需求拆解能力
    - 用户洞察（读懂用户心思）
    - 跨角色交互协作

  # ② 统一表述：三版，按篇幅挑。数据一个字不许改。
  versions:
    # 三档按【字数从紧到松】排。命名别再叫 one_line / short（之前反而是 one_line 更长，会搞混）。
    compact: "系统学习过心理学与认知科学，擅长挖掘用户深层需求并将其转化为可落地的产品方案，据此支撑 ToC 服务运营，累计服务客户 {{客户量级}}"
    standard: "系统学习过心理学与认知科学，擅长挖掘用户深层需求并将其转化为可落地的产品方案，据此支撑 ToC 服务运营，累计服务客户 {{客户量级}}，好评率{{好评率}}、复购率{{复购率}}"
    expanded: "我系统学习过心理学与认知科学，擅长挖掘用户的深层需求，并把这些需求翻译成能落地的产品方案；这套方法支撑了我的 ToC 服务运营实践，累计服务客户 {{客户量级}}，好评率{{好评率}}，复购率{{复购率}}"
  canonical: standard      # 默认用这一版；compact 砍百分比、expanded 只是把句子松开展开
  version_rule: |
    三版【只允许改连接和详略】，不允许加新信息、加新数字、加评价性形容词。
    compact 用于字数紧的场合（招呼语）；standard 是默认；expanded 用于简历、面试陈述这类能铺开的场合。

  # ③ 因果链：四环缺一不可（压缩成一句也得四环都在）
  chain:
    - 专业背景      # 系统学习过心理学与认知科学
    - 洞察需求      # 挖掘用户深层需求
    - 转化为产品方案 # 转化为可落地的产品方案
    - 数据验证      # {{客户量级}} / {{好评率}} / {{复购率}}
  chain_must_be_complete: true
  note_chain: |
    本人原话：「『专业背景 → 洞察需求 → 转化为产品方案 → 数据验证』这一因果链必须完整。」
    含义：不能只说"我学过心理学"（缺后三环），也不能只报"{{客户量级}}、{{好评率}}"（缺前三环）。

  # ④ 冻结数据：不得改写，不得杜撰新的量化指标
  frozen_numbers:
    客户量级: "{{客户量级}}"
    好评率: "{{好评率}}"
    复购率: "{{复购率}}"
  numbers_rule: |
    本人原话：「客户量级与百分比数据保持一致，不得改写或杜撰新的量化指标。」
    → 写 {{客户量级}} 就永远是 {{客户量级}}，不写"近 300""两百多位"这类换皮说法；
    → 不允许为了好看再加"满意度 95%""NPS xx"这类档里没有的数字。

  # ⑤ 被顶替的经历 → ⛔ 2026-10-29 本人拍板升级为【全禁】，任何场景都不提
  replaced_experiences:
    - id: coordination
      name: '{{经历公司B全称}}'
      why: "它讲的是销售与协调结果，不是『沟通 / 拆解 / 洞察 / 协作』的方法论"
      scope: 全禁（任何场景都不再提）
    - id: sales
      name: '{{经历公司A}}'
      why: "它讲的是转化与抗压，同样不是软技能方法论"
      scope: 全禁（任何场景都不再提）
  replaced_note: |
    ✅ 2026-10-29 本人答复：「全禁」。
    落实方式：两条锚点在 resume_anchors 里标了 enabled: false（原文保留，想恢复改回来即可），
    并从 ability_evidence_order.ops 里移除。
    ⚠ 简历原件里这两段还在 —— 简历要不要删是另一件事，等本人另行说明。

  # ⑥ 语气
  style:
    - "专业克制"
    - "避免空泛自夸（不写'沟通能力极强''洞察力出众'这类没有支撑的形容词）"
    - "用事实和因果代替评价：说'我怎么做的 + 数据怎么样'，不说'我很擅长'"

  # ⑦ 机器兜底检查（_check_greeting.py 读这一段）
  checks:
    # ⚠ "协调"这个词不收：{{经历公司B}}那条里本来就有"协调 {{协调人数}}"，
    #   收进来会把"讲执行力的经历"误判成"岗位要协调能力"（实测误报 4 条）。
    trigger_words: [沟通, 需求拆解, 拆解需求, 洞察, 同理心, 读懂用户, 用户心智, 跨角色, 协作, 换位思考]
    chain_markers:
      专业背景: [心理学, 认知科学]
      洞察需求: [挖掘, 洞察, 深层需求]
      转化为产品方案: [转化, 落地, 产品方案]
      数据验证: ["{{客户量级}}", "{{好评率}}", "{{复购率}}"]
    # ⛔ 2026-10-29 本人拍板升级：这两条任何场景都不许出现（不再限触发场景）
    forbid_always: ["{{经历公司B}}", "{{经历公司A}}"]
    forbid_when_triggered: ["{{经历公司B}}", "{{经历公司A}}"]   # 保留旧键兼容，语义同上

