    # ★ 2026-11-10 晚 本人拍板（合并）：内容已并入 project_rag 的 blocks，本锚点停用。
    #   保留定义仅为留痕 + 避免代码断引用；enabled: false 让 ANCHORS 直接过滤掉它。
    enabled: false
    text: "『AI 反馈闭环』：玩家评价经 AI 分析后，店长可『修改 / 确认 / 驳回』，重复问题自动聚合成改进任务；未配置大模型时用本地规则兜底，两种模式都输出问题维度、原始证据、严重程度和改进建议"
    short: "『AI 反馈闭环』：店长可复核 / 驳回，重复问题聚合成改进任务；没配模型时本地规则兜底"
    github: "{{作品集URL}}"   # ★ 2026-11-01 本人扩：整个剧本杀项目共用一个作品集
    need_github_phrase: true
    # 同样按 JD 词频挑：流程 130 次 / 质量 125 / 闭环 22 / 复核 4
    # （"人机协作""风险控制"在 114 条 JD 里出现 0–1 次，挂了也命中不了 → 换成真会出现的词）
    proves: [流程, 质量, 闭环, 复核]
    blocks:
      - duty: "玩家评价经 AI 分析，店长可修改 / 确认 / 驳回，重复问题聚合成改进任务"
        data: ""
        skill: "闭环"
      - duty: "未配置大模型时用本地规则兜底"
        data: "两种模式都输出问题维度 / 原始证据 / 严重程度 / 改进建议"
        skill: "质量"
    source_note: |
      出处：portfolio-site/index.html:88-89（"未配置时使用本地规则兜底""店长可修改、确认或驳回"）、
      app.py:189（"使用大模型/本地规则兜底"）、index.html:71（六步流程末尾"店长复核→改进任务"）

  psychology:
    # ✅ 2026-10-29 本人亲自定【统一表述】，三版文案全部来自 soft_skill_narrative.versions
    #    （旧版是"系统学习过心理学与认知学，且有大量客户沟通经验"，没有因果链、也没有数据 → 作废）
    # ⚠ text 开头【没有"我"】：拼装时前面会自动加"我"（见 say_as），
    #   写成"我系统学习过"会变成"我我系统学习过"（实测踩到）。
    text: "系统学习过『心理学与认知科学』，擅长挖掘用户深层需求并将其转化为可落地的产品方案；据此支撑 ToC 服务运营实践，累计服务客户『{{客户量级}}』，好评率『{{好评率}}』，复购率『{{复购率}}』"
    short: "系统学习过『心理学与认知科学』，擅长挖掘用户深层需求并将其转化为可落地的产品方案，据此支撑 ToC 服务运营，累计服务客户『{{客户量级}}』"
    # ★ 它不是"我做过"的一段经历，是一个专业背景 → 前缀用"我"而不是"我做过"
    say_as: ability
    proves: [需求拆解, 沟通, 洞察, 同理心, 协作, 用户, 产品方案]
    enabled: true          # ✅ 2026-10-27 用户本人拍板恢复："允许使用那句心理学话术"
    max_per_message: 1
    placement: hook        # ★ 改：允许出现在钩子段承接 JD，而非固定中段
    # ★ 2026-10-29 本人规则：这条是【软技能场景的默认素材】，命中触发词必须优先用它
    soft_skill_default: true
    chain: [专业背景, 洞察需求, 转化为产品方案, 数据验证]   # 四环缺一不可
    frozen_numbers: ["{{客户量级}}", "{{好评率}}", "{{复购率}}"]           # 不得改写、不得加新指标
    change_from_v1: "位置解锁（句未变，次数上限未变）"
    note: |
      它命中目标 JD 高频出现的'需求拆解/同理心/诉求洞察'，是最强弹药，别当填充物。
      ⛔ 2026-10-29 本人规则：凡是"沟通能力 / 需求拆解 / 用户洞察 / 跨角色协作"的场景，
      一律用这条，不许拿{{经历公司B}}（coordination）或{{经历公司A}}（sales）顶替。
    resume_backing: user_confirmed   # ✅ 2026-10-28 用户本人确认：「心理学与认知学相关依据真实存在，
                                     #    简历中未写明属正常情况」。此事关闭，不再质疑、不再要求补出处。
    risk_open: 无（2026-10-28 由用户确认关闭）
    history:
      - "2026-10-27 停用：简历无出处"
      - "2026-10-27 恢复：用户本人拍板允许使用"
      - "2026-10-28 用户确认依据真实存在，争议彻底关闭；_check_anchors.py 已加豁免"
      - "2026-10-29 本人亲自定统一表述（含完整因果链 + 冻结数据），并规定软技能场景默认用它"

# ─────────────────────────────────────────────────────────────
# 6. 三版输出
# ─────────────────────────────────────────────────────────────
variants_output:
  full:   "饱满版：JD 锚点 + 2 条简历锚点 + 提问结尾"
  human:  "活人版：口语化，允许短句和不完整体，去掉书面连接词"
  brief:  "精简版：压缩行数，保留最强 1 条锚点"
  shared_rule: "三版都必须含 career_hook（用'最主要的是'引出职业规划）"

required_discourse:
  career_hook_phrase: "最主要的是"
  connectives_preferred: ["并且", "另外", "同时", "而且"]
  invent_data: forbidden

# ─────────────────────────────────────────────────────────────
# 7. 二次跟进
# ─────────────────────────────────────────────────────────────
followup:
  # ✅ 2026-10-28 你本人手动试过：BOSS 允许对同一个 HR 重复发送。
  # 之前卡在这一条上（外部查不到任何资料，只能实测）—— 现在闸门解开，开。
  enabled: true
  min_days: 3                # 机器默认值；见下方 timing_note，优先用对方给的时间线
  max_per_target: 1          # 同一家最多补一句，再没回就关掉，绝不第三次
  evidence: true             # ✅ 2026-10-28 从【判断】升级为【证据】，见下方两个高校来源
  timing_note: |
    以前写"72 小时"，是拍的。现在查到的口径是：
      · 宝鸡文理学院就业指导（高校官方）：投后 **5–7 个工作日**再跟是最合适的窗口，
        刚投一两天 HR 还在收简历；并明确把沉默分成"没看到"和"不合适"两种，
        要求先拿岗位要求跟自己简历核一遍，确认是"没看到"才值得跟。
        http://jycyxxw.bjwlxy.cn/detail/news?id=1844244&type_id=4835
      · 阿拉巴马大学职业中心：**如果对方给过时间线，以对方的时间线为准**，超过再隔一两天。
        https://career.sa.ua.edu/?p=6166/
    对我们这个场景（没有对方承诺的时间线）来说：**5–7 个工作日 ≈ 7 个自然日**，
    比原来的 72 小时宽松一点。3 天太急，容易踩在"HR 还在收简历"那一段上。
  length_ratio: 0.5           # 长度不超过第一句的一半
  length_floor: 45            # 但至少 45 字，短了等于没说（原 30 字，随首句下限一起抬）
  hard_rules:
    - "不得复述第一条的任何句子（逐字比对 ≥8 字连续相同即判复述）"
    - "必须带一个全新的 JD 锚点，或换一条没用过的简历经历"
    - "长度 ≤ 第一条的一半"
    - "同一对象最多跟一次，再无回应即关闭"
    - "找不到新东西可说就不发 —— 宁可不跟，也不重复一遍"
  # 跟进句豁免两条日常规矩：职业规划句、60 字下限。
  # 原因：只有第一句一半的长度，硬塞职业规划句会把它挤成一句废话。
  exemptions:
    - "career_hook_phrase（职业规划句）"
    - "LENGTH 下限 60 字"
  openers:
    - "您好，再补一句："
    - "打扰一下，补个更直接的点："
    - "您好，另外想到一点："
  closings:
    - { id: "F1", text: "方便的话我把简历发您。" }
    - { id: "F2", text: "若方便，想补发一份简历。" }
    - { id: "F3", text: "希望能有机会细聊。" }
  # ↓ 这条是 2026-10-28 新增的关键限定：以前只知道"跟进有用"，不知道上限在哪。
  evidence: "Gem 620 万封：发 1 封累计回复 8.8%，3 封 16.3%；hireEZ 270 万封：3–4 次触达捕获 90–95% 回复。
            两个来源独立、方向一致，但【测的是招聘方找候选人，我们方向相反】—— 只能借机制不能借数值。"
  limit_evidence: |
    ⚠ 上面那条支持"跟进有用"，但【不支持我们连续跟三次】。方向反过来时，
    正确的次数上限要问"求职者 follow up 雇主"的规范，这条现在有了两个高校官方来源：
      · 宝鸡文理学院就业信息网（高校官方，中文场景，直接讨论招聘软件）：
        「平台显示『已读』但不回复的，只跟一次。发第二次就是打扰了。」
        http://jycyxxw.bjwlxy.cn/detail/news?id=1844244&type_id=4835
      · ASU W. P. Carey 职业服务中心（高校官方）：
        感谢 24h → 一周无回应第一次跟进 → 再一周第二次 → **之后 move on**。
        https://career.wpcarey.asu.edu/?p=277595/
    我们取更严的那个（一次）：因为我们在一百家公司面前发同样的话，
    每次多跟一句，是拿整批账户的声誉去换单条的 1–2 个点。
  risk_open: "BOSS 语境下补第二句会不会被当骚扰：无平台数据。所以限定同一家最多一次、长度减半、不复述。"
  note: "第一次跑请先只跟 3–5 条，观察两天没异常再放量。"

# ─────────────────────────────────────────────────────────────
# 7.5 面试之后（以前这块完全是空的）—— 本轮证据最强的一部分
# ─────────────────────────────────────────────────────────────
interview_followup:
  enabled: true
  evidence: true
  # 三个相互独立的一手机构，跨中美语境，说法完全一致（本库里证据最硬的一条）
  sources:
    - "Northeastern University 职业中心：24h 内；80% 招聘经理表示收到感谢有帮助，最偏好简单邮件；3–4 句；禁止道歉/重答题目/补述 https://careers.northeastern.edu/?p=27054"
    - "University of Virginia 职业中心：24h 内（邮寄一周）；超 6–8 位面试官可只谢组织者 https://career.virginia.edu/resources/post-interview-thank-you-guide"
    - "上海市人力资源和社会保障局：24h 内；三层价值＝点名+一个具体细节／重提面试里谈到的核心挑战并给自己的数字／弥补一个小遗憾 https://rsj.sh.gov.cn/dzb/rsj/2026-01-15/aid/03-02.html"
  thanks:
    when: "面试当天，最迟 24 小时内"
    length: "3–4 句 ≈ 60–110 字"
    must_have:
      - "点对方的姓/称谓 + 具体日期 + 具体岗位"
      - "一个只有你俩在场才知道的细节（他带你参观过办公区 / 他提到的那个具体难题）"
      - "重提面试里谈到的那个核心挑战，并接一句你当时给的数字"
    must_not:
      - "为面试表现道歉"
      - "大段补述你没来得及说的话（Northeastern 明确禁止，上海人社却说可以补一个『小遗憾』→ 见下方矛盾）"
      - "薪水、福利、任何让人多干活的请求"
    open_conflict: |
      ⚠ 真实矛盾，不替你抹平：
        美方两校（Northeastern / W.P. Carey 同一体系）：**Don't** add new information you forgot to mention
        上海人社：补一个"小遗憾"（某个没答好的题）是加分项
      猜测：两者可能是同一动作的不同幅度 —— 补一句针对具体问题的更正 ≠ 大段补述；也可能是文化差异。
      处置：做成台账里的 A/B 变量，不在这里硬判谁对。
  status_ask:
    when: "以面试官给的时间线为准；没给时间线就按 5–7 个工作日。对方给的时间过后隔一两天再问"
    source: "阿拉巴马大学职业中心 https://career.sa.ua.edu/?p=6166/ 与 ASU https://career.wpcarey.asu.edu/?p=277595/"
    max_times: 2
    ladder:
      - "第 1 次：对方时间线 +1~2 天，或 5–7 个工作日"
      - "第 2 次：再过一周"
      - "第 3 次及以后：**不发**。两家高校来源一致说这是上限"
    channel: "文字优先（邮件/站内信），电话只在对方说过可以打时才打"

# ─────────────────────────────────────────────────────────────
# 7.6 被拒之后 —— 只有弱源，只取【结构】不取【数字】
# ─────────────────────────────────────────────────────────────
rejection:
  evidence: false            # ⚠ 全部来源是同质化求职自媒体，无一手的 → 只采动作结构
  note: |
    四个来源方向一致但全是求职博客（joblabs / inhersight / prismresume / applygoat），
    它们给的"6 个月""120 词"这类数字彼此雷同、疑似互抄 —— 可以照着做，不要当成规矩。
  four_moves:
    - "先等 24 小时再回（不要在收到拒信的当下回）"
    - "感谢，具体地说到某个人某件事（不是模板句）"
    - "问【一个】容易回答的反馈问题：『这个岗位上我哪一项还差得最多？』（只问一次，不追）"
    - "表达未来意愿并留一个接口：『如果后续有更合适的岗位，希望还能考虑我』"
  must_not:
    - "争辩、要求对方重新考虑"
    - "追问为什么（对方通常不会说，而你追问的语气会被记住）"
    - "在同一封里既要反馈又要推荐别家 —— 像在谈条件"
  reapply_gap: "线索级：类似岗位至少隔半年再审（来源全是弱源，别当硬规矩）"

# ─────────────────────────────────────────────────────────────
# 8. 回复率台账（解开上面所有悬案的唯一途径）
# ─────────────────────────────────────────────────────────────
ledger:
  file: "data/greeting_ledger.csv"
  required_before_launch: true      # ★ 不开就等于把所有争论无限期延后
  min_sample_before_conclusion: 60
  fields:
    - send_time
    - hr_gender_source      # 头像 / 昵称 / 未知 —— 记录你是怎么判断的，回头算出错率
    - salutation_variant    # neutral / jiejie
    - closing_variant       # Z / A / B / C / D
    - word_count
    - has_jd_anchor         # 有 / 无
    - read_24h
    - read_72h
    - replied
  analysis_plan: "跑满 60 条后，按 salutation_variant / closing_variant / word_count 分组算回复率；赢的上 SOP，输的下线"

# ─────────────────────────────────────────────────────────────
# 9. 模型路由（省该省的钱，别省决定成败的那层）
# ─────────────────────────────────────────────────────────────
model_routing:
  coarse_filter: deepseek-v4.1-flash     # 跑量大、判断简单
  semantic_scoring: glm-5.3              # 读 JD 输出结构化 JSON
  greeting_draft: kimi-k3.1-pro          # ★ 决定成败的话术层，不省
  greeting_review: deepseek-v4-pro       # 交叉评分，与出稿模型不同源
  rationale: "token 成本在这个量级是噪声；真正稀缺的是每日配额和 HR 的注意力"

# ─────────────────────────────────────────────────────────────
# 10. 待本人拍板（机器不擅自决定的，全部列在这里）
# ─────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────
# 10. 本人拍板记录（2026-10-29）
# ─────────────────────────────────────────────────────────────
settled_2026_10_29:
  note: "本人 2026-10-29 对机器提出的 6 个待定问题逐条给了结论。以下是定论，机器照此执行。"
  items:
    - id: 字数上限
      decision: "360 字"
      where: "length.max"
      extra: "超了就整条丢掉最次要的那条能力，不切半句；一条不剩则判生成失败，不硬凑"

    - id: 性别不明怎么称呼
      decision: "按男性处理，称『某总』"
      where: "salutation.gender_unknown"

    - id: RAG 项目与作品集的对应
      decision: "只有项目①（剧本杀门店 AI 助手）写『已上传 GitHub + 有作品集』，项目②③不写"
      where: "rag_github_rule.note"
      extra: "实现方式为『只对 yaml 里真挂了 github 字段的锚点套用』，不按项目名硬判"

    - id: 求职动机句式
      decision: "不套模板。接模型后由模型按公司/岗位现写，句式参考本人例句"
      example: "最主要的是我对 AIGC 在广告场景落地特别感兴趣"
      where: "motivation.examples / motivation.style / motivation.model_plan"
      extra: "没接模型期间用手写模板兜底，接上模型后模板作废"
      # ⚠ 2026-10-29 晚本人追加修订（部分推翻上面这条）：
      revised_2026_10_29_evening:
        decision: "严禁讨好奉承式表达，改为体现理性层面的价值判断"
        quote: "不得使用『自己真的想去这家公司』这类讨好、奉承对方的表达，
                而应体现理性层面的价值。可改为『最主要的是我认为某某行业发展十分具有前景』
                或『最主要的是我长期规划打算深耕 AI 产品经理这个岗位』
                等基于行业前景与个人长期规划的表述。"
        where: "motivation.flattery_ban / motivation.angle"
        side_effect: |
          1) motivation.must_mention 由 [公司或产品, 岗位方向] 改为 [行业前景 或 个人长期规划]
          2) 旧模板尾巴「这是我认真想清楚的方向」停用（属表决心，非理性判断）
          3) v2 那条"长期职业规划"当时被本 SOP 否掉，本次**部分恢复**为合法角度
          4) 兜底模板 templates.with_company / no_company 同步换成新句式
        default_angle: "career（长期规划版）—— 因为它带岗位名，每条不同"

    - id: 对应能力的措辞
      decision: "不照抄 JD 原词。允许两种走法：迁移（语义相同的不同概念）、收窄（大能力落成某个具体能力）"
      where: "evidence_format.ability_clause"
      extra: |
        本人原话：「一个合理且有人味的打招呼语应该是不死板的，比如可以是迁移的语义相同的
        不同概念，或者对应的能力中的某个特定能力。到时候为你接上模型之后，你根据需求点来
