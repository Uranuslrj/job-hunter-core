# Boss 直聘 · 打招呼语生成规范（模板）
# ─────────────────────────────────────────────────────────────
# 这是「脱敏模板」。六段框架、防编造机制、能力词表、变体池句式
# 都是【通用方法论】，照抄即可；所有 {{占位符}} 都要填成你自己的内容。
# 填完把本文件另存为 greeting_spec.yaml 即可生效。
#
# 两种用法：
#   ① 按这套模板填：只改 {{占位符}}，框架和规则别动（最稳）。
#   ② 自己写模板：六段顺序、规则、变体池都可以重排/重写，
#      但建议保留「经历+数据+能力」这个核心，以及防编造机制。
#
# ⚠ 说明：原文里的「本人 2026-xx-xx 拍板」「本人 SOP」等字样，
#   是原作者的个人决策留痕，保留这些注释是为了让你看懂
#   「为什么这么设计」。你用的时候，这些就是你自己。
# ─────────────────────────────────────────────────────────────

# 用途：生成与质检打招呼语的唯一事实源；改这里不用改代码
# 版本：v2.0 草案（由 knowledge/boss-greeting.md 的结论下沉而来）
# v1 原版保留在 SOP/求职SOP-话术规范-v1原文.md｜本文件相对 v1 的改动均在 change_from_v1 字段里写明

meta:
  version: v3.0-final
  updated: 2026-10-29
  source_of_truth: 本人 2026-10-29 手写的《求职 SOP（框架 + 规则 + 档案）》
  owner: 本人          # ★ 2026-10-29 定：只有本人可以改。机器不得自行增删任何一条
  ai_may_invent: false # 机器只做"按规则执行"，不发明、不发挥、不优化
  note: |
    ⚠ 本文件 2026-10-29 由本人 SOP 覆盖重写。v2 时期那些"证据/来源/推导"字段
    仍然保留在下方各条里（作为当初为什么这么定的留痕），但**规则本身以本人 SOP 为准**。
    两者冲突时，以本文件里标着 source: 本人SOP 的字段为准。

# ─────────────────────────────────────────────────────────────
# 0. 固定框架（本人 2026-10-29 定，六段，顺序不可调换）
# ─────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────
# 1. 量化公式（唯一实质性改动，有双源支撑）
# ─────────────────────────────────────────────────────────────
quantified_formula:
  v1: "量化数据 + 核心动作 + 产出结果"
  v2: "做过的项目(一句话) + 量化数据 + 核心动作 + 产出结果"   # ← 补 STAR 的 S/T
  rationale:
    evidence: true
    note: |
      缺 S/T，数字失去标尺：HR 不知道 3 倍从多少涨到多少，默认按最小规模算。
      ⚠ 2026-10-28 本人指出：原先把 S/T 写成了从 JD 里读出来的【需求点标签】
      （如「工作流搭建」「任务拆解」），那不是我们的情境，是对方的要求 ——
      等于把 HR 刚写过的"我要什么"换个说法再念一遍。
      他不缺人告诉他他要什么，他缺的是知道我们做过什么。
      换成【做过的项目】：项目名本身就是标尺（"扣子调研工作流"自带场景），
      背景交代了，字还没多花，判断还交回给 HR 自己去做 ——
      他自己得出的结论，比我们替他下的结论更可信。
    source:
      - "DDI 官方 1974 STAR 定义 https://www.ddiworld.com/about-ddi/ddi-history-founders"
      - "TheLadders 2018 眼动 https://www.theladders.com/career-advice/why-do-recruiters-spend-only-7-4-seconds-on-resumes"
  constraint: |
    S/T 用【项目名称】交代，一句话说完，不许写成铺垫段落（7.4 秒初筛）。
    项目名自带情境，不要再加「在……的场景下」这类解释。
  caveat: "这两条是态度层+机制层证据，未证明补 S/T 能提高回复率 → 用 ledger 验证"

# ─────────────────────────────────────────────────────────────
# 2. 称呼
# ─────────────────────────────────────────────────────────────
salutation:
  default: "您好"
  # ✅ 2026-10-28 本人拍板：
  #   「男士 / 性别不清楚 → 称『姓+总』」；明确是女士 → 「您好」。
  #   姓氏从岗位数据里的 boss_name 取第一个字（102/102 条岗位都带这个字段）。
  # ✅ 2026-10-29 本人 SOP 定稿（覆盖 v2 的"女性一律您好"）：
  #   男性 → 姓 + 总；女性 → 姓 + 姐姐；后面一律接"您好"。
  #   例：刘女士 → 刘姐姐您好，｜ 张先生 → 张总您好，｜ 牛旭阳 → 牛总您好，
  rules:
    - when: "boss_name 含『女士』（例：刘女士）→ 明确女性"
      use: "取第一个字 + 姐姐 + 您好（刘姐姐您好）"
    - when: "boss_name 含『先生』（例：张先生）→ 明确男性"
      use: "取第一个字 + 总 + 您好（张总您好）"
    - when: "boss_name 是全名、性别不明（例：牛旭阳 / 周敏 / 彭菲茗）"
      use: "取第一个字 + 总 + 您好（牛总您好）"
    - when: "拿不到姓名，或判断不了（例：『呼中心』这种不是人名的）"
      use: "您好 —— 不猜，猜错比不用更糟"
  salutation_suffix: "您好"   # 本人 SOP："后接『您好』等开场礼貌语"
  gender_unknown: "按男性处理，称『某总』"   # ✅ 2026-10-29 本人：「2：同意你的想法」
  settled: 2026-10-29
  known_limit: |
    102 条北京岗位里 boss_title 的实际分布：招聘者 20、猎头顾问 18、HR 10、HRBP 6、
    招聘专员 5、招聘经理 4、招聘主管 3、人事经理 3、人事 2、校招HR 2、总经理 2。
    也就是说**大部分对方的职务是专员/人事**，对他们叫「总」是抬举过头还是得体，
    没有数据支持，由本人承担这个判断。
  change_from_v1: "女性一律'姐姐' → '姐姐'降为条件性 A/B 变体"
  evidence: true
  rationale: "'哥/姐'属拟亲属化称谓，机制是把已有工作关系软化成私人关系；
              而 Boss 打招呼是首次陌生接触，没有可供软化的既有关系 → 凭空索要亲密"
  source:
    - "人民日报《讽刺与幽默》2025-06-27 https://paper.people.com.cn/fcyym/pc/content/202506/27/content_30084314.html"
    - "李晓菁/刘爱玉 空姐情感劳动实证研究（南开） https://nxwx.nankai.edu.cn/2017/1109/c12611a184074/page.htm"
  variants:
    - { id: neutral, text: "您好", when: default }
    - { id: jiejie,  text: "姐姐", when: all_conditions_met }
  conditions_for_jiejie:
    - "对方从头像/昵称判断明显年轻"
    - "岗位/公司调性偏扁平（初创、MCN、社区内容类）"
    - "本批次同岗位条数 ≥ 6 且正在做 A/B"
  on_gender_uncertain: "一律用您好 —— 猜错比不用更糟"
  rollout_advice: "★ 先别改。按 v1 跑 30 条攒基线，再切一半做 A/B；现在就改，将来无法判断好坏"

# ─────────────────────────────────────────────────────────────
# 3. 结尾（保留 v1 句式，增设提问型变体）
# ─────────────────────────────────────────────────────────────
closing:
  # ✅ 2026-10-29 本人 SOP 第 7 条：固定输出"如果可以的话非常希望可以和您交流一下"
  #   → 变体轮换、按情况挑、女性版叠字，全部停用。
  fixed: true
  fixed_id: Z
  fixed_text: "如果可以的话非常希望可以和您交流一下"
  # ★ 2026-11-01 本人新增：结尾句的同义变体池（G1~G4 全录）。
  #   语义等价，只换语气和连接词。
  fixed_variants:
    - { id: G1, text: "方便的话，很想跟您具体聊一聊" }
    - { id: G2, text: "如果方便，希望能和您深入交流一下" }
    - { id: G3, text: "很期待能有机会跟您细聊" }
    - { id: G4, text: "不知道方不方便，想跟您再进一步聊聊" }
  note: |
    ✅ 本人 SOP 原文：「结尾礼貌语：固定输出"如果可以的话非常希望可以和您交流一下"」
    ⚠ 两条已作废（机器不再执行）：
      ① v2 时期的"女性版句尾多一个『下』字"—— 本 SOP 不区分性别，统一"一下"
      ② v2 时期的"按这条岗位的情况挑一个最合适的"—— 本 SOP 要求固定这一句
    下方 variants 保留作为留痕，机器只读 fixed_id = Z 这一条。
  change_from_v1: "一句定本 → 一组变体轮换（Z = 你的原句，原样保留）"
  compliance_fact: "BOSS 现行公开协议未禁止模板化话术；禁的是骚扰/欺诈/拟人程序。'重复=封号'是误传"
  real_risk: "平台治理可能把回复率当低质信号（源自 LinkedIn 一手规则），故需轮换"
  risk_caveat: "LinkedIn 机制 ≠ Boss 机制，Boss 公开条款未说明，属风险不是事实"
  variants:
    - { id: Z, text: "如果可以的话非常希望可以和您交流一下", type: 愿望型, note: "你的原句。❌ 2026-10-28 本人要求删除『女性版句尾多一个下字』这条" }
    - { id: A, text: "除此之外，我很想听听这个岗位目前在推进的真实难点。", type: 提问型 }
    - { id: B, text: "另外也想请教，这个岗位日常最常需要对齐的协作方是哪些。", type: 提问型 }
    - { id: C, text: "还有就是，团队现在最希望新人先补上的那块能力是哪一块。", type: 提问型 }
    - { id: D, text: "同时我也好奇，这个岗位后续会往 Agent 方向深扎，还是更偏业务落地。", type: 提问型 }
  # ✅ 2026-10-28 本人拍板：**不轮换，按这一条岗位的情况挑一个最合适的。**
  #   判断顺序从上往下，命中第一条就用它，都不命中就用 Z（你的原句）。
  pick_by_situation:
    - { id: D, when_any: [Agent, 智能体, 大模型, LLM, 工作流, 技术路线],
        why: "对方在做技术方向选择，问路线最能引出他说话" }
    - { id: C, when_any: [培养, 带教, 成长, 新人, 应届, 实习, 0到1, 从零],
        why: "岗位偏初阶或写明带教，问『先补哪块能力』正好对上他的顾虑" }
    - { id: B, when_any: [协作, 对接, 跨部门, 沟通, 协调, 推进各方],
        why: "JD 强调多方协作时，问『最常对齐谁』显得你懂这活儿怎么干" }
    - { id: A, when_any: [难点, 挑战, 搭建, 体系, 优化, 落地],
        why: "岗位在推进中的业务，问『真实难点』最自然" }
    - { id: Z, when_any: [],
        why: "兜底：以上都不沾边时，用你原来那句" }
  rotation:
    rule: "已停用 —— 随机轮换会让结尾和岗位对不上号（2026-10-28 本人要求）"

# 3.5 自我介绍（固定句 · 2026-10-28 本人定稿）
# ─────────────────────────────────────────────────────────────
# ⚠ 2026-10-29 本人 SOP 定稿，固定输出这一整句，一个字不改、不做轮换。
#   跟 v2 的区别：v2 用的是简称「哈商大」且届别在句尾；本 SOP 用全称且届别前置。
self_intro:
  enabled: true
  text: "我是{{学校全称}}{{届别}}{{专业}}{{学历}}"
  placement: "紧跟在称呼之后（某姐姐您好 / 某总您好 之后），固定不变，不做轮换"
  # ★ 2026-11-01 本人新增：给固定句配同义变体池，按轮换规律从池里挑一句。
  #   目的不是"改内容"，是打破"100 条一字不差"的群发特征。
  #   每个变体语义严格等价（数字/校名/届别一个字不改），只换语序和连接词。
  variants:
    - { id: A1, text: "我现在在{{学校全称}}读{{专业}}，本科一本，{{届别}}" }
    - { id: A3, text: "{{学校全称}}{{专业}}专业，本科一本，{{届别}}在读" }
    - { id: A4, text: "我就读于{{学校全称}}，{{专业}}方向，一本本科，2027年毕业" }
  # ⚠ A2（哈商大…）已由本人 2026-11-01 明确剔除，不录入。
  note: |
    ✅ 本人 2026-10-29 SOP 第 2 条原文：固定输出"我是{{学校全称}}{{届别}}{{专业}}{{学历}}"
    注意与 v2 的两处差异（本人已改，机器跟随）：
      ① 「哈商大」→ 全称「{{学校全称}}」
      ② 届别从句尾挪到校名之后：「{{届别}}」紧跟校名
      ③ 补了「本科」二字

# ─────────────────────────────────────────────────────────────
# ★ 2026-10-30 本人新增规则：开头流水账结构（intro_flow）
# ─────────────────────────────────────────────────────────────
# 三条，全部由本人原话拍板：
#   ① 学历句后【固定】接一句「曾于{{实习公司}}AI产品经理岗位实习」。
#   ② 从实习句往后，每一段经历（实习里的、剧本杀、工作流、其他项目）
#      开头一律用「也 / 同时」接续，不能再出现「我做过 / 我会」这类另起的新句。
#   ③ 用到剧本杀项目时，先写总起句「我做过剧本杀DM门店AI运营项目，且已应用到门店」，
#      最后再接具体选中的那一段能力。
intro_flow:
  enabled: true
  intern_line: "曾于{{实习公司}}AI产品经理岗位实习"    # ① 学历句后固定这句
  # ★ 2026-11-01 本人新增：实习句的同义变体池（B1~B4 全录）。
  intern_line_variants:
    - { id: B1, text: "之前在{{实习公司}}做过 AI 产品经理的实习" }
    - { id: B2, text: "有过一段{{实习公司}} AI 产品经理的实习经历" }
    - { id: B3, text: "在{{实习公司}}实习过，岗位是 AI 产品经理" }
    - { id: B4, text: "我在{{实习公司}}的 AI 产品经理岗实习过" }
  # ② 连接词：经历段统一用这些词接续，不再「我做过」另起一句
  connectors: ["也", "同时"]
  # ③ 剧本杀项目总起句（先这句，再写具体能力）
  rag_opener: "我做过剧本杀DM门店AI运营项目，且已应用到门店"
  # ★ 2026-11-10 晚 本人拍板（合并）：总起句现在只绑 project_rag 一个锚点。
  #   DM 匹配 / 反馈闭环已并入 project_rag 的 blocks，不再是独立项目。
  rag_opener_anchors: [project_rag]
  # ★ 2026-11-01 本人新增：剧本杀总起句的同义变体池（C1~C4 全录）。
  rag_opener_variants:
    - { id: C1, text: "我做过一个剧本杀门店的 AI 运营项目，已经真实上线在门店里用了" }
    - { id: C2, text: "我之前做的是剧本杀门店 AI 运营这个项目，不是纸面方案，已经在门店跑起来了" }
    - { id: C3, text: "我的项目是给剧本杀门店做 AI 运营助手，已经实际投到门店里用了" }
    - { id: C4, text: "我做过剧本杀门店的 AI 运营项目，现在已经在门店实际运转" }
  note: |
    ✅ 本人 2026-10-30 原话（三条，逐字确认后写入）：
      ① 学历句后固定写「曾于{{实习公司}}AI产品经理岗位实习」。
      ② 后面无论描述哪一部分经历，前面紧跟着的都要是「也…/同时…」，不能另开一句。
      ③ 应用剧本杀项目时，先写「我做过剧本杀dm门店ai运营项目且已应用到门店」，
         最后再描述具体选中的那部分能力。
    ⚠ 本人确认：剧本杀项目加「且已应用到门店」后，原本的「已上传 GitHub + 作品集」
      那句【仍保留】，两句都在。

# 到岗信息：HR 看完打招呼语后第一句要问的，就这两件事。
# 写进招呼语 = 省掉一轮来回；不写 = HR 得先问才能往下走。
# ✅ 2026-10-29 本人 SOP 第 6 条：固定输出"每周可出勤5天、实习6个月以上"
availability:
  enabled: true
  text: 每周可出勤5天、实习6个月以上
  placement: "框架第 5 段（求职动机之后、结尾之前），固定输出，不做轮换"
  # ★ 2026-11-01 本人新增：到岗句的同义变体池（F1~F4 全录）。
  #   ⚠ 只对「实习岗」套用（跟 text 一样受 intern_only 约束），数字 5 天/6 个月不改。
  variants:
    - { id: F1, text: "每周能到岗 5 天，实习期 6 个月以上没问题" }
    - { id: F2, text: "时间上每周可以出勤 5 天，能做 6 个月以上的实习" }
    - { id: F3, text: "每周 5 天都能出勤，实习时长 6 个月起" }
    - { id: F4, text: "出勤这块我每周能保证 5 天，实习至少 6 个月" }

  # ───────────────────────────────────────────────────────────
  # ★ 2026-10-29 晚本人修订（原话）：
  #   「投递的岗位若不是实习去掉『每周可出勤5天、实习6个月以上』这句话，
  #     若是实习在这句话后面加上『可随时到岗』」
  # ───────────────────────────────────────────────────────────
  intern_only: true          # ★ 只有实习岗才写到岗句；非实习岗整句不出现
  intern_extra: 可随时到岗   # ★ 实习岗在这句话后面追加
  # 判定的三路信号（按可靠度排序，命中任意一路即判为实习）
  # ⚠ 用哪路信号是实测校准出来的，不是拍脑袋 —— 见下方 calibration
  detect_intern:
    signals:
      - id: 结构化字段
        rule: "days_per_week 或 least_month 有值 → 实习"
        why: "Boss 官方字段，**只有实习岗才会填**（全职岗这两个字段是空的）。最可靠。"
      - id: 薪资单位
        rule: "salary_raw 含『元/天』或『/天』 → 实习"
        why: "按天计薪基本等于实习；全职都是 15-22K 这种月薪。"
      - id: 岗位名关键词
        in_fields: [title]           # ⚠ 只查岗位名，**不查 JD 正文**
        keywords: [实习, 实习生, 见习, 实习期, intern, Intern, INTERN]
        why: |
          JD 正文里出现"实习"多半是"有实习经验优先"这类要求，**不代表这岗位是实习**，
          查 JD 会把一堆 15-22K 的全职岗误判成实习（实测误判 7 条）。
    fallback: "非实习"
    fallback_reason: |
      三路都没命中就按【非实习】处理 → 不写到岗句。
      理由：全职岗 HR 不关心"每周出勤几天"，写了反而显得把自己当学生；
      而实习岗漏写"可随时到岗"，HR 得再问一轮。宁可不写，不要写错。
    calibration:
      date: 2026-10-29
      sample: "114 条真实岗位，用『关键词查 title+jd_text』当基准对比"
      found: |
        · 关键词查 JD → 误判 7 条（薪资 15-22K 的全职岗，JD 里提了"实习经验"）
        · 关键词漏掉 2 条（"ai产品经理"200-250元/天、"大模型AI技术产品经理"200-300元/天
          —— 标题没写实习，但按天计薪且有周天数，是实打实的实习岗）
      fixed_by: "改用三路信号组合：结构化字段 + 薪资单位 + 只查岗位名的关键词"
  output_examples:
    实习岗: "最主要的是我长期规划打算深耕 AI 产品经理这个岗位，每周可出勤5天、实习6个月以上，可随时到岗。"
    非实习岗: "最主要的是我长期规划打算深耕 AI 产品经理这个岗位。"
  note: |
    ✅ 原 SOP 第 6 条：固定输出"每周可出勤5天、实习6个月以上"，不写"随时到岗"。
    ⚠ 2026-10-29 晚本人修订：**非实习岗整句删除；实习岗在这句后面加"，可随时到岗"**
    —— 与 v2 的「可随时到岗，可连续实习六个月每周五天」顺序也不同（本版到岗句在后）。
    ⚠ 简历抬头里写的仍是「随时到岗｜可连续实习六个月｜每周五天」，
    与招呼语口径不完全一致 → 待本人确认是否统一。

# ─────────────────────────────────────────────────────────────
# 3.6 能力展现（本人 2026-10-29 SOP 第 3 条）
# ─────────────────────────────────────────────────────────────
evidence_format:
  source: 本人SOP
  rule: "提取 JD 中的核心需求点，与我的经历和能力点逐一匹配"
  pattern: "经历 ＋ 量化数据 ＋ 对应能力"
  note: |
    本人 SOP 第 3 条原文：
      「提取JD中的核心需求点，与我的经历和能力点逐一匹配，
        按'经历＋量化数据＋对应能力'的格式输出，
        确保所写能力能明确回应JD的要求」
    跟 v2 的区别：v2 是「做过的项目＋量化数据＋核心动作＋产出结果」，
    本 SOP 把尾巴换成了「对应能力」—— 每条证据必须挂一句"所以我能干什么"，
    直接回应 JD 那条要求，让 HR 自己读完就能对上号。
  must_end_with_ability: true
  # ⚠ 下面这张表是【机器的实现细节】，不是本人 SOP 的内容。
  #   SOP 只要求"对应能力"这个成分存在，没规定具体怎么说。
  #   当前用最朴素的"能独立完成 + 能力名"，本人可逐条改成自己的说法。
  # ★ 2026-10-29 本人给了判定标准（原话）：
  #   「对应能力就是根据你判断的那个需求的点进行描述……
  #     所有的对应能力不一定要照着念jd中的需求，一个合理且有人味的打招呼语应该是
  #     不死板的，比如可以是迁移的语义相同的不同概念，或者对应的能力中的某个特定能力。
  #     到时候为你接上模型之后，你根据需求点来思考对方真正需求的可能是对应的哪些能力，
  #     而不是哪个能力。」
  #   → 结论：**不是照抄 JD 原词**。是把"对方真正想要的那件事"翻译成
  #     "我们这条经历能具体干什么"，允许两种走法：
  #       ① 迁移：语义相同的不同概念（心理学 → 挖掘需求）
  #       ② 收窄：把大能力落成其中一个具体能力（AI 应用落地 → 能把 AI 想法做到能用）
  #
  #   本人还给了完整范例（原话）：
  #     「我系统学习过心理学与认知学，故很擅长挖掘用户需求并转化成落地的产品方案，
  #       因而拥有 ToC 服务运营累计服务客户 {{客户量级}}，好评率{{好评率}}，复购率{{复购率}}，
  #       能跑用户访谈、拆需求」
  #     —— 这段就是【迁移论证】：心理学（没直接做过）→ 挖掘需求（能迁移）→ ToC 服务（拿数据顶）
  #        最后一跳落在"能跑用户访谈、拆需求"这个具体能力上。
  ability_clause:
    # 下面这张表是【规则版兜底】：没接模型时按能力名查表。
    # 每条都刻意避开 JD 原词，写成"能干的具体事"。
    # ⚠ 接上模型后，这一层交给模型按 JD 需求点现想，不再查表（本人 2026-10-29 同意）。
    default: "能独立完成{name}"
    exceptions:
      AI 应用落地: "能把 AI 应用从想法做到能用"
      大模型应用: "能把大模型接进真实业务流程"
      Agent 搭建: "能自己搭出一个能跑起来的 Agent"
      智能体搭建: "能自己搭出一个能跑起来的智能体"
      工作流搭建: "能把一套流程串起来自动跑"
      自动化工具: "能做小工具把重复活自动化"
      机器人运维: "能保证机器人日常不出岔子"
      AIGC 内容生产: "能用 AIGC 批量产出内容"
      RAG 检索: "能把检索这块调到可信"
      提示词调优: "能把提示词调到稳定出活"
      知识库搭建: "能把散落的资料整理成能查的知识库"
      需求拆解: "能把模糊的需求拆成能做的条目"
      需求梳理: "能把需求理清楚并排好先后"
      PRD: "能把调研结果整理成 PRD"
      PRD 产出: "能把调研结果整理成 PRD"
      任务拆解: "能把大任务拆成能排期的小件"
      诉求洞察: "能听出对方真正想要的是什么"
      场景梳理: "能把使用场景一条条理清楚"
      用户研究: "能自己做用户研究"
      用户访谈: "能自己跑用户访谈"
      用户体验: "能从用户角度挑出问题"
      跨部门沟通: "能跟不同部门把事推动下去"
      沟通协调: "能在多方之间把事协调下来"
      现场协调: "能在现场把人和事安排好"
      项目推进: "能把项目一期一期往前推"
      流程跟进: "能盯住流程每个节点不放"
      活动执行: "能把活动从头到尾落地"
      文档沉淀: "能把做过的事写成别人能用的文档"
      复盘沉淀: "能把每轮做完的得失留下来"
      流程图产出: "能把流程画成图给人看"
      优先级排序: "能判断哪些事该先做"
      原型绘制: "能先把想法画成原型给人看"
      交互设计: "能把交互细节定下来"
      界面设计: "能把界面做到能上手"
      数据分析: "能从数据里看出问题在哪"
      数据整理: "能把乱的数据理干净"
      信息提取: "能从一堆材料里挑出有用的"
      取数分析: "能自己取数自己分析"
      报表产出: "能把结果做成别人看得懂的报表"
      指标拆解: "能把大指标拆成能测的小指标"

# ─────────────────────────────────────────────────────────────
# 3.7 RAG 项目必须带 GitHub + 作品集（本人 2026-10-29 SOP 第 3 条附加）
# ─────────────────────────────────────────────────────────────
rag_github_rule:
  source: 本人SOP
  enabled: true
  rule: "只要提到我的 RAG 项目，必须描述【已上传到 GitHub】且【有作品集】"
  triggered_by: [project_rag]
  text: "已上传到 GitHub，并配了可访问的作品集"
  # ★ 2026-11-01 本人新增：GitHub 话术的同义变体池（D1~D4 全录）。
  text_variants:
    - { id: D1, text: "代码已经放到 GitHub 上了，还配了一个可以直接打开看的作品集" }
    - { id: D2, text: "这个项目在 GitHub 上开源了，作品集也能在线看" }
    - { id: D3, text: "项目我已经传到 GitHub，作品集做了个在线页面可以随时看" }
    - { id: D4, text: "代码在 GitHub 上有，另外做了个可访问的作品集页面" }
  portfolio_url: "{{作品集URL}}"
  note: |
    本人 SOP 第 3 条原文：「只要提到我rag的项目必须描述我将其上传到GitHub上且有作品集」。
    ✅ 已定（2026-10-29 本人：「3：只写1的就可以」）：
      只有项目①（剧本杀门店 AI 助手）挂 GitHub + 作品集，项目②③不提。
      实现上就是"只对 yaml 里真挂了 github 字段的锚点套用这句"，不按项目名硬判。
    ★ 2026-11-01 本人扩：剧本杀项目不只有 project_rag 一个模块，还有 project_dm_match
      （DM 匹配）、project_review_loop（反馈闭环），它们同属项目①、共用一个作品集。
      所以这两个模块也补挂了 github 字段 + need_github_phrase，被选中时同样带 GitHub 句。
    ⚠ 仍未定：作品集 URL 要不要真写进招呼语正文？
      URL 很长（约 45 字），且 Boss 站内对链接的处理不确定
      → 当前只在正文说"有作品集"，不带 URL。

# ─────────────────────────────────────────────────────────────
# 3.8 匹配不足怎么办（本人 2026-10-29 SOP 第 4 条）
# ─────────────────────────────────────────────────────────────
mismatch_policy:
  source: 本人SOP
  steps:
    - order: 1
      action: 能力迁移论证
      rule: "JD 要求的某能力点我没有对应经历时，先对【已有的能力】做合理的能力迁移论证"
    - order: 2
      action: 能力编造
      rule: "若迁移也确实无法成立，可对该需求点【最主要的能力】进行编造"
  hard_ban:
    - "严禁编造任何经历"
    - "严禁编造任何数据"
  note: |
    本人 SOP 第 4 条原文：
      「若JD要求的某能力点我没有对应经历，可对已有能力进行合理的能力迁移论证；
        若迁移也确实无法成立，可相应的进行该需求点最主要的能力编造，
        但严禁编造任何经历和数据。」
    ⚠ 这是 2026-10-29 本人放开的新权限：允许"能力编造"（v2 时期只允许"能力型补充"且
    要求简历背书）。机器按此执行，但会在输出里标出这一条是【迁移】还是【编造】，
    方便本人面试前知道哪句话没有事实支撑。
  record_in_ledger: true
  ledger_field: "invented_ability"   # 记录这一条是迁移还是编造，面试前可查

# ─────────────────────────────────────────────────────────────
# 3.9 求职动机（本人 2026-10-29 SOP 第 5 条）
# ─────────────────────────────────────────────────────────────
motivation:
  source: 本人SOP
  prefix: "最主要的是我"
  rule: "自动生成针对【该公司】和【该岗位】的合理化投递理由，
         表达真实、有说服力，但必须是【理性层面的价值判断】，不得讨好奉承"
  # ⚠ 2026-10-29 晚本人修订：must_mention 原为 [公司或产品, 岗位方向]，
  #   现改为 [行业前景 或 个人长期规划]。理由见下方 flattery_ban。
  must_mention: [行业前景 或 个人长期规划]

  # ───────────────────────────────────────────────────────────
  # ★ 2026-10-29 晚本人亲自修订（推翻上午那条"理由必须落到这家公司"）
  # 本人原话：
  #   「不得使用"自己真的想去这家公司"这类讨好、奉承对方的表达，
  #     而应体现理性层面的价值。可改为"最主要的是我认为某某行业发展十分具有前景"
  #     或"最主要的是我长期规划打算深耕 AI 产品经理这个岗位"
  #     等基于行业前景与个人长期规划的表述。」
  # ───────────────────────────────────────────────────────────
  flattery_ban:
    enabled: true
    rule: "求职动机要体现【理性层面的价值判断】，不是讨好、奉承对方。
          说『我真的很想去贵司』是把主动权交出去，读着像没别的选项、在求人；
          说『我认为这个行业有前景』『我规划深耕这个岗位』是在陈述自己的判断，
          HR 读到的是『这人想清楚了』，不是『这人在求我』。"
    forbid:
      - "真的想去这家公司"
      - "很想去这家公司"
      - "很想加入贵司"
      - "对贵司仰慕已久"
      - "贵司平台广阔"
      - "贵司前景好"
      - "是我理想的公司"
      - "非常向往"
      - "特别想来"
      - "希望能给个机会"
      - "这是我认真想清楚的方向"
    also_forbid: "任何以『对方很好 + 我很想来』为逻辑的表达，一律换成『我判断这件事值得做』"
    note: |
      ⛔ 上面最后一条「这是我认真想清楚的方向」是**旧模板自带的尾巴**，
         同样属于表决心、不是理性判断，2026-10-29 晚随本次修订一并停用。

  # 两个合法角度（本人给的范例；机器在这两个里选，不自行发明第三种）
  angle:
    default: career          # 没接模型期间的兜底默认值，本人可改
    career:
      name: 个人长期规划
      tpl: "最主要的是我长期规划打算深耕{goal}这个岗位"
      example: "最主要的是我长期规划打算深耕 AI 产品经理这个岗位"
    industry:
      name: 行业前景
      tpl: "最主要的是我认为{industry}行业十分具有前景"
      example: "最主要的是我认为 AIGC 行业发展十分具有前景"
    # ★ 2026-11-01 本人新增：职业规划句的同义变体池（E1~E4 全录，含本人确认过的
    #   E2「我不是随便投」、E3「说到底」）。
    #   ⚠ 本人 2026-11-01 定：E 组变体一律保留「最主要的是」开头（质量门硬性认这个词，
    #   丢了会 17 条不过门），后面接各自不同的说法来破群发。{goal}/{industry} 不填。
    career_variants:
      - { id: E1, text: "最主要的是，我的长期规划就是在这个方向深耕下去" }
      - { id: E2, text: "最主要的是我不是随便投，长期就打算往这个方向扎" }
      - { id: E3, text: "最主要的是，说到底我的长期规划就是在这个岗位上做深做透" }
      - { id: E4, text: "最主要的是，我长期的目标就是深耕这个方向" }
    note: |
      长期规划版带 {goal}，每个岗位方向不同 → 天然有差异，不会 5 条一字不差；
      行业前景版的 {industry} 只取客观大类（见下方 industry_words）。
      ⚠ 绝不写成"贵司所在的 XX 行业"—— 那等于猜对方业务，可能猜错，属编造。

  # 行业词怎么定（规则版兜底；只认客观大类，不编造公司业务）
  industry_fallback: "AI 应用"
  industry_words:
    - match: [AIGC, 生成式, 文生图, 生图, 绘画, 图像生成, 视频生成]
      word: AIGC
    - match: [大模型, LLM, Agent, 智能体, RAG, 提示词]
      word: 大模型应用
    - match: [AI, 人工智能, 机器学习]
      word: AI 应用

  examples:
    - "最主要的是我认为 AIGC 行业发展十分具有前景"
    - "最主要的是我长期规划打算深耕 AI 产品经理这个岗位"
  style:
    - "陈述自己的判断（我认为/我规划/我判断），不作姿态、不夸对方"
    - "行业前景版只说客观大类，不猜对方具体业务"
    - "长期规划版要说清深耕的是【哪个岗位】，不能只说『我想做 AI』"
    - "允许带一点个人判断，但不得编造公司信息"
  model_plan: |
    ⚠ 待接模型后：这一句交给模型现写，模板作废。
      模型要看的输入：公司名、岗位名、JD 里反复出现的场景/技术词、
      我们档里跟这些词最贴的经历（用来支撑"为什么是我感兴趣"而不是空喊）。
      ⚠ 接模型后仍受 flattery_ban 约束 —— 模型也不许写讨好奉承的话。
  # 下面是没接模型时的兜底模板（可用变量：{goal} 岗位方向、{industry} 行业、{title} 岗位全称）
  # 2026-10-29 晚同步改为新句式，防止别处还读 templates 时漏出旧话
  templates:
    with_company: "最主要的是我长期规划打算深耕{goal}这个岗位"
    no_company:   "最主要的是我长期规划打算深耕{goal}这个岗位"
  note: |
    本人 SOP 第 5 条原文：「自动生成针对该公司和该岗位的合理化投递理由，
    表达真实、有说服力的工作热情，让HR相信我对公司或岗位有强烈意向。
    固定输出格式为最主要的是我+理由」
    ⚠ 2026-10-29 晚本人修订：上面那句里的"让HR相信我有强烈意向"，
      实现方式**不是**表决心说"我真的很想去"，而是给出理性理由让 HR 自己得出这个结论。
      同理，v2 那条"最主要的是 + 长期职业规划"当时被本 SOP 否掉（说它只讲自己），
      本次修订把它**部分恢复**——长期规划重新成为合法角度之一。

# ─────────────────────────────────────────────────────────────
# 3.5 长度上限（真正生效的地方，代码从这里读）
# ─────────────────────────────────────────────────────────────
length:
  # ⚠ 2026-10-29：本人 SOP【没有规定字数】。这里的两个数不是 SOP 规则，
  #   只是物理兜底 —— 防止超出 Boss 输入框、以及防止生成出只剩骨架的残句。
  min: 120
  max: 400
  # ✅ 2026-10-29 本人拍板：上限 360。
  #   ✅ 2026-11-01 本人再拍板：上限 360 → 400。
  #   原因：加了「心理学软技能固定第二段」（约 70 字）后，360 容不下两条价值段，
  #   只剩 1 条。提到 400 刚好容下「心理学固定段 + 两条价值段」，仍约一屏半。
  #   超了怎么办：从【最次要的那条能力】开始整条丢掉（不切半句），
  #   丢到能装下为止；一条都不剩就判定生成失败，不硬凑。
  settled_by: 本人
  settled_on: 2026-11-01
  why_360: |
    本人原话：「1：上线为360吧。」
    360 字 ≈ 手机屏幕一屏半。三条完整能力约占 200 字，加上六段固定部分约 150 字，
    刚好卡在上限附近 —— 也就是说大多数岗位会【自然丢到两条能力】或把第三条压缩。
    这是本人有意识的选择（宁可少说一条，也不让 HR 滑两屏）。
  note: |
    ⚠ 這是當前最紧的一道約束，改之前先看清它换來了什麼。
    固定段合計 77 字：称呼 2 + 自我介紹 20 + 職業規劃 19 + 到岡 18 + 結尾 18。
    三條完整證據需要約 108 字，所以上限不到 185 就放不下。
    96 條北京崗實測：
        max=160 → 3條:0   2條:92  1條:4
        max=185 → 3條:87  2條:5   1條:4
        max=200 → 三條證據 + 提問式結尾 全都裝得下 ✅ 當前值
    長度上限的證據：Lavender 2025（30 萬封冷郵件） 50–125 詞回複率最高；
    Boomerang 2016（4000 萬封）超過 200 詞明顯下降。
    200 漢字折算約 125 英文詞 = 跨在最優區的上沿（折算本身是估算，不是證據）。
    ⚠ 但這是英文、B2C 實例、常標時間，三者皆與我們场景不同 → 必須台本校準。

# 4. 质量门（四条全过才能进待审队列）
# ─────────────────────────────────────────────────────────────
quality_gate:
  - id: anchors
    rule: "必须同时含 1 个 JD 锚点 + 1 个简历锚点"
    jd_anchor: "JD 原文里的原词、具体职责、或该公司/产品的具体信息"
    on_fail: rewrite

  - id: similarity
    rule: "已删除（2026-10-28 本人要求）—— 不再刻意压低与已发招呼语的相似度"
    enabled: false
    note: |
      原规则是"与最近 20 条相似度 ≤0.6"。实测发现它跟统一骨架的模板天然打架
      （97 条中位数 0.81，前 30 条里 22 条超标），等于自己卡自己。
      本人拍板：只要内容符合 JD 需求即可，不再为"看起来不一样"扭曲内容。
    on_fail: pass

  - id: length
    rule: "落在 length.min ~ length.max 之间（2026-10-29 起从上面 length 段读，不再写死）"
    note: |
      ⚠ 2026-10-29：本人 SOP 未规定字数。这一条现在只做"物理兜底"
      （别超输入框、别短成骨架），不再当作话术规则去卡内容。
    evidence: true
    change_from_v1: "60–120 → 80–140 → **100–160**（2026-10-28 本人要求扩篇幅）"
    note: |
      ★ 上一版的 60–120 是拍的，因为当时找不到任何带测量方法的来源。现在有了：
      Boomerang 4000 万封邮件的长度曲线 https://blog.boomerangapp.com/2016/02/7-tips-for-getting-more-responses-to-your-emails-with-data/
      —— 50–125 词区间回复率全部 >{{复购率}}，而【低于 50 词比 125 词掉得更快，
      25 词的效果等同于 2000 词】。长度是有下限的，不只是有上限。
      50 英文词 ≈ 中文 75–100 字（这个折算是我估的，不是证据）。
      ⚠ 这条是英文、2016 年、日常邮件，三个属性都跟我们的场景不同 → 必须台账校准。
      校准方法：把 word_count 分成 <70 / 70–90 / 90–120 / >120 四组，跑满 60 条看哪组回复率高。
    on_fail: rewrite

  - id: forbidden
    rule: "禁用词命中即重写"
    words:
      weak_verbs:      ["琢磨", "聊得来", "不发怵", "应该还行", "大概"]
      self_lowering:   ["其实", "可能不太", "虽然我没什么", "如果不嫌弃"]
      expose_weakness: ["愿意补", "还在学", "虽然我经验不足", "会努力跟上"]
      # 短板留到面试被问再答，第一次接触不主动暴露

  - id: evidence_check
    rule: "事实性信息（数字 / 项目名 / 公司名 / 时间 / 量化成果）必须真实存在于简历原文"
    method: "回溯：把生成的话拆回 JD 句 ID 与简历条目 ID，查无对应即判编造"
    on_fail: rewrite
    relaxed_2026_10_28: |
      ✅ 本人放开：允许补充简历里没写的【能力型表述】（掌握/熟悉某项技术、具备某项能力），
      因为很多学过的东西没写进简历。但铁律三条不变：
        ① 不得编造任何数字
        ② 不得编造项目名、公司名、时间
        ③ 不得虚构具体成果或量化业绩
      只要句子里出现数字/项目名/公司名/时间 → 判编造，整条退回。

# ─────────────────────────────────────────────────────────────
# 4.5 能力型补充库（2026-10-28 新增：本人放开"不可编造"限制后的产物）
# ─────────────────────────────────────────────────────────────
capability_pool:
  enabled: true
  max_per_message: 1
  hard_rule: |
    只准以"掌握/熟悉/能/会用 + 某项技术或能力"的形式出现。
    句子里一旦出现下面任何一样，整条作废：数字、项目名、公司名、时间、业绩成果。
  items:
    - id: rag
      text: "熟悉 RAG 的检索流程：关键词检索和向量检索怎么配合、什么时候该降级兜底"
      short: "熟悉 RAG 检索与降级兜底"
      match: [RAG, 检索, 知识库, 向量, 召回, Embedding, BM25]
      resume_backing: true        # 简历里出现过 RAG/向量/BM25/Embedding
    - id: prompt
      text: "能自己写 Prompt 并做迭代验证"
      short: "能自己写 Prompt 并做迭代验证"
      match: [Prompt, 提示词, 大模型, LLM, 生成, 调优]
      resume_backing: true        # 简历里出现过 Prompt/大模型/LLM
    - id: workflow
      text: "会用扣子（Coze）把一套流程搭成工作流跑通"
      short: "会用扣子搭工作流跑通全流程"
      match: [工作流, Coze, 扣子, 流程, 自动化, 编排]
      resume_backing: true        # 简历里 Coze/工作流 出现 9/12 次
    - id: data
      text: "能用 Python 和 SQL 取数，做基础的数据整理和分析"
      short: "能用 Python 和 SQL 取数分析"
      match: [数据, 分析, SQL, Excel, 报表, 指标, 取数]
      resume_backing: true        # 简历里 Python/SQL/Excel 都出现过
    - id: prototype
      text: "会用 Figma 画原型，先把需求画出来再对齐"
      short: "会用 Figma 画原型再对齐"
      match: [原型, Figma, 交互, 界面, Demo]
      resume_backing: true        # 简历里 Figma/原型 各出现 4 次
    # ⚠ 别跟 prototype 混成一条：JD 写 PRD 时拿 Figma 原型去接属于张冠李戴。
    #   简历依据：「输出需求清单、优先级、PRD与核心流程图」
    - id: prd
      text: "能把调研到的信息整理成需求清单、优先级和 PRD"
      short: "能把信息整理成需求清单和 PRD"
      match: [PRD, 需求文档, 需求梳理, 需求清单, 优先级, 流程图]
      resume_backing: true
    - id: api
      text: "能对接 API，把模型能力接进业务流程里"
      short: "能对接 API 把模型接进业务"
      match: [API, 接口, 对接, 集成, 联调, SDK]
      resume_backing: true        # 简历里 API 出现 3 次
    - id: decomp
      text: "能把业务方的模糊诉求拆成可执行的条目"
      match: [需求拆解, 需求分析, 诉求, 同理心, 洞察, 拆解]
      resume_backing: false       # ⚠ 简历里没有这句话的原文 → 需本人勾选才能启用
      need_confirm: true
    - id: interview
      text: "做过用户访谈，能把访谈里的话整理成可排期的需求"
      match: [访谈, 调研, 用户研究, 反馈, 问卷]
      resume_backing: false
      need_confirm: true
  note: |
    ⚠ 带 need_confirm: true 的两条，简历里找不到原文，是"你学过但没写进简历"那类。
    机器默认**不启用**它们。要启用：把 need_confirm 删掉，或告诉我你确认具备。

# ─────────────────────────────────────────────────────────────
# 4.2 JD 需求点怎么处理（2026-10-28 本人要求）
# ─────────────────────────────────────────────────────────────
jd_points:
  rule: "先判断 JD 最重视的三条能力，再按重视度从高到低，用我们的经历/能力去接"
  max_points: 3
  min_points: 2
  must_be_matchable: true
  note: |
    不再逐条覆盖 JD 全部内容 —— 那样写出来的话像在复述招聘启事。
    三条能力同一主题只取一次（比如 JD 里 AI/大模型/Agent 都写了，只算一条），
    免得三条点看着是三件事、其实是一个意思说了三遍。
    每条能力必须能拿出证据；拿不出的整条丢掉，不硬凑。
  min_points_note: |
    ★ 2026-11-10 本人拍板：招呼语里证据（经历/能力）最少 2 条，不能只剩 1 条。
    原因：只有 1 条证据的招呼语太单薄，像群发，撑不起"有料"的第一印象。
    做法：字数装不下时丢到还剩 2 条就停；2 条都放不下就判生成失败（宁可这条不发）。
    实测（2026-11-10，199 个过 60 分岗位）：3 条 121、2 条 77、1 条仅 1 个，
    所以这条下限几乎不影响投递量，只挡住极少数"单薄到只剩 1 条证据"的边角岗。
  pick_order: "按【词的权重 × 出现次数 + 出现位置】算重视度，取前 3 条"

# ─────────────────────────────────────────────────────────────
# 4.2 拆 JD（2026-10-29 本人要求：三层策略第一层，不再只靠关键词打分）
# ─────────────────────────────────────────────────────────────
# 把 JD 拆成两类东西：
#   ① 显性关键词 —— JD 原词（RAG / Agent / Coze / PRD / 知识库 / 验收…），
#      原样复用，作用是"让 HR 3 秒扫到对口词"。这些词驱动锚点选择 +
#      校验最后话术里到底有没有对上号（关键词对齐）。
#   ② 隐含要求 + 硬约束 —— 实习时长 / 转正 / 出勤 / 编程 / 学历 / 年限…，
#      这些【不进话术】，而是输出成「风险&注意点」，给人审阅时看。
#   ⚠ 地点（城市）不在这里重复拆：上游 target_roles.hard_filter.city 已经拦过了。
jd_decompose:
  # 显性关键词（JD 原词），分两组：
  #   tech     —— 技术名词，命中后优先拿 RAG / 工作流类经历去接
  #   product  —— 产品动作词，命中后优先拿 PRD / 原型类能力去接
  explicit_keywords:
    tech:
      - RAG
      - Agent
      - 智能体
      - Coze
      - 扣子
      - 大模型
      - LLM
      - 向量检索
      - 语义检索
      - 检索增强
      - 知识库
      - Embedding
      - 多模态
      - 混合检索
      - 提示词
      - Prompt
      - AIGC
      - 评测
      - 评测集
      - 评测用例
    product:
      - PRD
      - 需求文档
      - 需求分析
      - 需求拆解
      - 场景拆解
      - 原型
      - Figma
      - 竞品分析
      - 用户研究
      - 用户洞察
      - 用户访谈
      - 产品规划
      - 功能设计
      - 交互
      - 上线迭代
      - 迭代
  # 隐含要求 + 硬约束 → 「风险&注意点」（只给人看，绝不写进话术）。
  # 每条命中一个关键词就记一条注意点；note 里的 {match} 会被替换成命中的词。
  hard_constraints:
    - id: 学历门槛
      keywords: ["985", "211", "硕士", "研究生", "博士", "统招"]
      note: "JD 要求「{match}」，学历可能被卡"
    - id: 经验年限
      keywords: ["3年以上", "三年以上", "5年以上", "五年以上", "2年以上", "两年以上", "1年以上", "全职经验"]
      note: "JD 写「{match}」，可能不招应届/实习"
    - id: 出勤
      keywords: ["每周5天", "每周 5 天", "每周4天", "全勤", "坐班", "到岗"]
      note: "JD 出勤要求「{match}」，核对你的可出勤时间"
    - id: 转正
      keywords: ["转正", "留用", "可留任"]
      note: "有转正/留用通道（「{match}」），可主动问"
    - id: 编程要求
      keywords: ["Python", "SQL", "编程", "写代码", "代码能力", "开发经验"]
      note: "JD 含编程要求「{match}」，注意是否超出能力范围"
    - id: 实习时长
      keywords: ["个月", "实习期", "实习时长", "时长"]
      note: "JD 提到「{match}」，核对实习时长要求"

# ─────────────────────────────────────────────────────────────
# 4.3 JD 关键词 → 能力名（2026-10-28 本人要求：别再搬 JD 原句）
# ─────────────────────────────────────────────────────────────
# 为什么要这一层：
#   直接把 JD 原句搬进招呼语，等于把对方刚写的"我要什么"再念一遍给他听 ——
#   不产生任何新信息，还白占二三十个字。
#   换成"能力名"，说的是"我会什么"，而且一句就能跟后面的证据接上。
ability_names:
