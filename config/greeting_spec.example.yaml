# 同一主题只出一条：三条能力要像三件事，不要像一件事说三遍。
# 数字是这条词的基础分（3=强信号，2=中，1=弱）。
# 数字 = 基础分。原则：【越具体越高】。
# AI、模型、数据、沟通这种几乎每份 JD 都会顺手带一句的泛词只给 1 分，
# 否则挑出来的三条能力会是「AI 应用」「模型应用」这种谁都能说的话。
jd_ability_themes:
  ai:
    工作流: 4
    Agent: 4
    智能体: 4
    自动化: 4
    RAG: 3
    提示词: 3
    Prompt: 3
    知识库: 3
    机器人: 3
    AIGC: 3
    大模型: 2
    LLM: 2
    人工智能: 2
    AI: 1
    模型: 1
