# 4.9 技术栈与作品集（本人 2026-10-29 SOP）
# ─────────────────────────────────────────────────────────────
tech_stack:
  source: 本人SOP
  # ✅ 2026-10-29 按 {{项目源码路径}} 原件补全（下面这些都能在代码/文档里找到出处）
  items: [Python（本项目只用标准库，零第三方依赖）,
          "RAG（BM25 0.6 + Embedding 0.4 混合，章节级 Chunk、Top-K 去重、来源引用）",
          "DashScope text-embedding-v4（1024 维，失败自动降级纯 BM25）",
          "OpenAI 兼容接口（可切 OpenAI / 中转站 / 通义千问，未配置时本地规则兜底）",
          "ReAct Agent", Coze, "SQLite（8 张业务表）",
          "HTML/CSS/JS", "HTTP/JSON", Figma, Excel,
          "Codex（用它辅助搭建本项目）"]
