  note: |
    技术栈本身【不直接罗列】进招呼语（罗列技术名词等于把简历抄一遍，
    HR 扫的时候会跳过）。它的用途是：判定某个能力点能不能做"能力迁移论证"
    （SOP 第 4 条第 1 步）—— 技术栈里有的，才允许论证成"我具备这个能力"。

# ─────────────────────────────────────────────────────────────
# 5. 简历锚点库（只用真实数据，不得扩写）
# ─────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────
# 锚点挑选的加权（2026-10-29 从 greeting.py 里提出来，变成本人可改的配置）
# ─────────────────────────────────────────────────────────────
anchor_pick:
  tech_anchors:                    # 这些是"技术项目"锚点，命中 JD 后额外加分
    - project_rag                  # 剧本杀门店 AI 助手（含 RAG / DM 匹配 / 反馈闭环全部）
    - project_intern               # {{实习公司}} AI 产品经理实习
    - project_workflow             # 个人权威知识调研 Coze 工作流
  tech_boost: 2
  why: |
    技术项目经历比"{{经历公司A}}/文创工作室"这类通用经历更贴 AI 岗，
    命中同样多关键词时优先用它 —— 否则会给 FDE 工程师配{{经历公司A}}经历（踩过）。

  # ★★ 2026-10-29 晚补：本人"简历铁律"落地到招呼语。
  #   铁律原话：JD 里出现与 RAG 剧本杀项目相关的要求（RAG、知识库、向量检索、
  #   LLM 应用、多轮对话、剧本/内容生成等），就必须把该项目写进对应位置。
  #
  #   为什么之前一直是 0 条：project_rag 的 proves 是"RAG/需求拆解/评测意识/工程健壮性"，
  #   这些词 JD 里几乎不会原样出现（实测字节、爱诗两条命中数都是 0），
  #   于是它掉进"兜底池"被打乱轮换，从此再也没被选中。
  #   17 条招呼语里 0 条提到它 —— 带 GitHub/作品集的也只有它，所以那句话也从没出现过。
  #
  #   现在的做法：不看 JD 有没有写"RAG"这个词，看它有没有提这类要求；
  #   命中就把该锚点【强制排到第一位】（不是加分，是插队），保证它一定用上。
  force_first_when:
    anchor: project_rag
    # JD 原文里命中任意一个即触发（单字词已排除，避免误伤）
    # ★ 2026-11-01 本人扩规则：触发范围从「只有 RAG 类」扩成剧本杀项目 proves 的
    #   【四个能力点全量】——需求拆解 / RAG / 评测意识 / 工程健壮性，任一中 JD 就强制插。
    #   因为「投入门店运营 + 上传 GitHub 有作品集」是杀手锏，必须带。
    jd_triggers:
      # ── ① RAG / 检索增强（原有）──────────────
      - RAG
      - 知识库
      - 知识检索
      - 向量检索
      - 向量库
      - 语义检索
      - 检索增强
      - 召回
      - Embedding
      - 嵌入模型
      - 切片
      - 分块
      - 大模型应用
      - LLM 应用
      - LLM应用
      - 智能问答
      - 多轮对话
      - 对话机器人
      - 提示词
      - Prompt
      - 评测集
      - 幻觉
      - 剧本
      - 内容生成
      - AI Agent
      - Agent
      - 大模型
      - 评测用例
      - 能力评测
      - 竞品分析报告
      # ── ② 需求拆解（2026-11-01 本人扩，2026-11-01 晚本人撤）────────
      #   ⚠ 本人拍板撤回：这组「需求拆解/需求分析/用户需求」等泛词，
      #   几乎每个产品岗 JD 都会写，全强制 = 每条都上剧本杀 RAG，
      #   且「用户需求」这类词最贴的是【心理学软技能】（挖掘用户深层需求），
      #   不该被拿来强制上剧本杀 RAG。故整组从强制触发词移除，
      #   改由 needs 主题正常匹配（psychology 排第一）承接。
      #   （保留此注释作决策留痕，不重新启用）
      # ── ③ 评测意识（2026-11-01 本人扩）──────────
      - 评测
      - 评估
      - 质量评估
      - 效果评估
      - 测试集
      - 评测标准
      - 指标
      - 数据标注
      - 标注
      # ── ④ 工程健壮性（2026-11-01 本人扩）────────
      - 降级
      - 兜底
      - 稳定性
      - 异常处理
      - 容错
      - 健壮性
      - 可靠性
      - 高可用
      - fallback
      - Fallback
      # ── ⑤ AI 反馈闭环（2026-11-01 本人扩）────────
      #   project_review_loop 的 proves 词，让「AI 反馈闭环」模块也纳入强制触发：
      #   JD 提到就上剧本杀项目，项目内按排序选到 feedback_loop 模块 → 走三段式。
      - 流程
      - 质量
      - 闭环
      - 复核
    why: |
      本人 2026-10-29 定：这是简历铁律在招呼语这边的对应锚点，命中即插队。
      本人 2026-11-01 扩：触发范围从「只有 RAG」扩成剧本杀项目 proves 的
      四个能力点（需求拆解/RAG/评测意识/工程健壮性）全量，因为「投入门店运营
      + 上传 GitHub 有作品集」是杀手锏，只要 JD 沾上任何一个能力点就必须带。
      本人 2026-11-01 再次拍板：维持四个能力点【全强制】，接受「几乎每条都带
      剧本杀项目」的后果（实测 22/28 条命中，其中约 18 条靠「评估/指标/拆解/
      需求分析」这类泛词命中，连 AI 销售、推广专员这类岗也会被塞进剧本杀项目）。
      本人看过后果后明确选了「维持全强制」，不降级、不加门槛。
      本人 2026-11-01 又扩：把「AI 反馈闭环」模块（project_review_loop）的 proves
      词「流程/质量/闭环/复核」也纳入 jd_triggers，让这个模块同样走「命中即强制
      插队 → 三段式（总起句 + 具体能力 + 固定话术）」，不再只靠普通匹配碰运气。

  # ★ 2026-10-29 新增：这两条说的是同一组数据（{{客户量级}} / {{好评率}} / {{复购率}}），
  #   同时出现会让 HR 看到两个"{{客户量级}}"，像凑数。用了其中一条，另一条本条招呼语里不再用。
  mutually_exclusive:
    - [psychology, ToC_service]

# ─────────────────────────────────────────────────────────────
# ★ 2026-10-29 晚 本人拍板：模型按「只选不写」正式接入招呼语
# ─────────────────────────────────────────────────────────────
#   规则照常跑完六段框架 / 拆 JD / 挑能力点；
#   到「这条能力用哪句证据接」这一步，把白名单里的候选列给模型，
#   **模型只回一个编号**，代码拿编号去取原文 —— 它没有写字的权力。
#
#   为什么这样接最安全（三条，缺一条都不能这么干）：
#     ① 数字不可能编：正文是代码从档案里取的原文，模型没碰过一个字
#     ② 六段框架不破坏：模型只影响"挑哪条证据"，不影响"怎么拼"
#     ③ 出错代价最小：最坏是挑了条没那么贴的，退回规则版即可，绝不空着发
evidence_pick:
  enabled: false                # 本人 2026-11-12 拍板：关闭模型选编号（73%超时打水漂，改纯规则版，根治队列条数漂移）
  max_candidates: 6             # 一次最多给模型看几个候选（太多它反而乱选，也费钱）
  max_calls_per_greeting: 10    # 一条招呼语最多问模型几次（含过不了门时的重试），超了走规则版
  temperature: 0.0              # 只要它"选"，不要它"发挥"
  timeout_seconds: 20           # 单次超时。实测正常 2~24 秒，12 秒会误杀 → 给 20 秒
  lock_when_forced: true        # RAG 铁律触发时，第一条能力点锁死，模型不许改
  lock_first: true              # 第一个能力槽一律按规则版，模型只改后面的槽
                                # ⚠ 锁的是「能力槽」，不是最终显示顺序：_lay_out 最后会按
                                #   「正文里有没有数字」重排，带数字的会往前顶。
                                # 好处：最看重的那条能力不给模型改，少一次调用、少几秒延迟。
                                # 想让模型连第一个槽也能改 → 改成 false。
  fallback: rule                # 超时/乱回/异常 → 一律退回白名单第一个（规则版）
  hard_rules: |
    1. 模型输出的必须严格是候选编号之一，否则整次作废，退回规则版；
    2. 铁律触发（JD 命中 RAG 类要求）时，第一条能力点锁死，模型连问都不问；
    3. 请求走 model_client.chat → 自动过隐私脱敏，公司名/人名在模型眼里是占位符；
    4. 一条招呼语超过 max_calls_per_greeting 次就停手，剩下的全走规则版（防费用和延迟失控）。
  off_switch: |
    想回退成纯规则版，两种办法，都不用改代码：
      ① 把 enabled 改成 false；
      ② 临时用环境变量 BOSS_EVIDENCE_PICK=off（跑完自动恢复，适合做 A/B 对比）。
  effect_note: |
    开着的代价：一条招呼语多 0~3 次模型调用，多花约 5~10 秒；
    同一批岗位重复跑会命中 model_client 的本地缓存，不重复计费。

