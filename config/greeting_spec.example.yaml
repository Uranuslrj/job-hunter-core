    需求拆解: 4
    需求分析: 4
    需求梳理: 4
    任务拆解: 4
    同理心: 4
    共情: 3
    洞察: 3
    诉求: 3
    拆解: 2
    场景梳理: 2
    # ★ 2026-11-01 本人拍板：纯销售岗（客户开发/成交/签单）的核心诉求也归 needs，
    #   让销售岗自动走心理学素材（{{客户量级}}/{{好评率}}/{{复购率}}）。只收【强销售信号词】，
    #   不收「销售」「客户」这两个泛词 —— 它们会误伤 AI 产品经理（JD 里随手写
    #   「了解客户」就触发，实测 28 条里「客户」命中 16 条）。
    签单: 3
    成交: 3
    拓客: 3
    获客: 3
    约谈: 2
    面销: 2
    拜访: 2
    # ★ 2026-11-01 补全：续签/扩签/增购（客户成功岗核心）、线索/商机/成单/提成
    #   （销售闭环关键动作）。这些都是强销售信号，产品经理 JD 极少出现。
    续签: 3
